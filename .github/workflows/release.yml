# Windows 설치 파일을 만든다 — v<버전> 태그를 올리면 릴리스까지, 그 밖에는 빌드 결과를 Actions 산출물로만 남긴다.
# 실행 환경(JDK · DCEVM · HotswapAgent · Maven)은 installer/fetch.sh 가 공개 배포처에서 받아 해시를 대조한다.
# 2026.10.29 : action 을 Node 24 로 도는 판으로 올렸다 (upload-artifact 는 v5 가 아직 Node 20 이라 v6). Rust 는 stable — 하한은 app/Cargo.toml 의 rust-version.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: 태그와 Cargo.toml 버전이 같은지 본다
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' app/Cargo.toml | head -1)"
          if [ "$want" != "$have" ]; then
            echo "::error::태그 $GITHUB_REF_NAME 와 app/Cargo.toml 의 version $have 가 다릅니다."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: 실행 환경 캐시
        uses: actions/cache@v5
        with:
          path: bin
          key: runtime-${{ hashFiles('installer/fetch.sh') }}

      # 2026.11.18 : Chocolatey 저장소가 응답하지 않아도 choco 는 「0/0 packages」 를 찍고 0 으로 끝난다.
      #              그래서 v0.30.0 이 NSIS 없이 Rust 빌드까지 4분을 돈 뒤 installer/build.sh 에서 멈췄다 — 세 번 다시 받고, 없으면 여기서 멈춘다
      - name: NSIS
        run: |
          exe="/c/Program Files (x86)/NSIS/makensis.exe"
          for n in 1 2 3; do
            [ -f "$exe" ] && break
            choco install nsis -y --no-progress || true
            [ -f "$exe" ] || sleep $((n * 20))
          done
          if [ ! -f "$exe" ]; then
            echo "::error::NSIS 를 설치하지 못했습니다 (Chocolatey 저장소 응답 없음). 잠시 뒤 실패한 작업만 다시 돌리세요."
            exit 1
          fi
          echo "MAKENSIS=C:/Program Files (x86)/NSIS/makensis.exe" >> "$GITHUB_ENV"

      - name: 시험
        working-directory: app
        run: cargo test --release

      - name: 설치 파일 만들기
        run: |
          bash installer/build.sh
          # 실행기의 자동 업데이트가 받은 파일을 대조한다 (GitHub 가 주는 digest 가 없을 때 쓰는 것)
          cd installer/dist
          for f in tomcatrun-setup-*.exe; do sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"; done

      # 실행기의 자동 업데이트가 이 서명을 공개 키(update.rs 의 PUBKEY)로 검증한다. 서명이 없는 판은 받지 않으므로 키가 없으면 여기서 멈춘다
      - name: 설치 파일 서명
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::저장소 비밀 TAURI_SIGNING_PRIVATE_KEY 가 없습니다."
            exit 1
          fi
          cd installer/dist
          for f in tomcatrun-setup-*.exe; do npx --yes @tauri-apps/cli@2 signer sign "$f"; done

      - uses: actions/upload-artifact@v6
        with:
          name: tomcatrun-setup
          path: installer/dist/tomcatrun-setup-*

      # 릴리스 본문은 CHANGELOG.md 의 「## <판> · <날짜>」 절이다 — 실행기의 업데이트 알림 · 변경 기록이 이 본문을 보여 준다
      - name: 릴리스 본문
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '/^## /{p = ($2 == v)} p' CHANGELOG.md > release-notes.md
          if ! grep -q '^- ' release-notes.md; then
            echo "::error::CHANGELOG.md 에 $ver 절이 없습니다."
            exit 1
          fi
          cat release-notes.md

      - name: 릴리스
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: installer/dist/tomcatrun-setup-*
          body_path: release-notes.md
