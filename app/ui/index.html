			(d.privateMb ? fmtMb(d.privateMb) : "쉬는 중") + "</b>" +
			(d.privateMb ? '<small class="num">작업 집합 ' + fmtMb(d.wsMb) + "</small>" : "") + "</div>");
		var l = memSnap.launcher;
		rows.push('<div class="mem" title="화면 엔진 포함"><span>실행기 화면</span><b class="num">' + fmtMb(l.privateMb) + '</b><small class="num">작업 집합 ' + fmtMb(l.wsMb) + "</small></div>");
		$("mems").innerHTML = rows.join("");
		renderStatusbar();
	}

	// 직전 기동 — 두 서버를 같은 시간 축에 그려 바로 견준다
	function renderPhases() {
		var list = state.servers.filter(function (sv) { return sv.phases && sv.phases.length; });
		if (!list.length) {
			$("phases").innerHTML = '<div class="empty" style="padding:4px 0">아직 기동 기록이 없습니다.</div>';
			return;
		}
		var max = Math.max.apply(null, list.map(function (sv) { return sv.phases.reduce(function (a, p) { return a + p.ms; }, 0); }));
		$("phases").innerHTML = list.map(function (sv) {
			var total = sv.phases.reduce(function (a, p) { return a + p.ms; }, 0);
			var segs = sv.phases.map(function (p, k) {
				return '<i style="width:' + (p.ms / max * 100).toFixed(2) + "%;background:" + PHASE_COLOR[k % PHASE_COLOR.length] + '" title="' + esc(p.label) + " " + (p.ms / 1000).toFixed(1) + '초"></i>';
			}).join("");
			var legend = sv.phases.map(function (p, k) {
				return '<span style="--c:' + PHASE_COLOR[k % PHASE_COLOR.length] + '">' + esc(p.label) + ' <b class="num">' + (p.ms / 1000).toFixed(1) + "초</b></span>";
			}).join("");
			return '<div class="ph"><div class="ph-top"><b>' + esc(sv.name) + '</b><span class="num">' + (total / 1000).toFixed(1) + "초</span></div>" +
				'<div class="ph-bar" style="width:100%">' + segs + '</div><div class="ph-legend">' + legend + "</div></div>";
		}).join("");
	}

	// sv 를 주면(서버 점검) 줄에 단추를 붙인다 — checkAct
	function checkHtml(list, sv) {
		return list.map(function (c) {
			// 값이 경로인 항목은 우클릭으로 탐색기 · 경로 복사
			var path = /^[A-Za-z]:[\\\/]/.test(c.detail) ? ' data-path="' + esc(c.detail) + '"' : "";
			var cls = (!c.ok ? "bad" : c.warn ? "warn" : "") + (c.detail.indexOf("\n") >= 0 ? " pre" : "");
			return '<li class="' + cls + '"' + path + ">" + ic(!c.ok ? "error" : c.warn ? "warn" : "check") + "<span>" + esc(c.label) + "</span><small>" + esc(c.detail) + "</small>" +
				(sv ? checkAct(c, sv) : "") + "</li>";
		}).join("");
	}

	// 같은 jar 다른 판은 치우고, 치운 jar 는 되돌린다. jar 를 옮기므로 톰캣을 끄고 받는 중이 아닐 때만 누를 수 있다.
	// 탐색 줄이기는 설정만 바꾸고 다음 기동부터 들어가므로 켜진 서버에서도 누른다
	function checkAct(c, sv) {
		var a = c.key === "depsDup" && sv.dedup.movable ? ["dedup_deps", "겹친 판 치우기 (" + sv.dedup.movable + ")", "primary"]
			: c.key === "depsAside" ? ["undo_dedup", "되돌리기", ""]
			: c.key === "scanHint" ? ["apply_scan_hint", "탐색 줄이기", "primary"] : null;
		if (!a) return "";
		var off = c.key !== "scanHint" && (sv.status !== "stopped" || sv.depsBusy);
		return '<div class="check-acts"><button class="btn sm ' + a[2] + '" data-act="' + a[0] + '"' +
			(off ? ' disabled title="서버를 끈 뒤에 할 수 있습니다"' : "") + ">" + esc(a[1]) + "</button></div>";
	}

	/* ---------- 상태 표시줄 — 켜진 설정만 묶음별 칩으로 ---------- */

	// 핫리로드 · 저장하면 컴파일은 이 도구의 핵심이라 꺼져 있어도 지운 줄로 남긴다. 나머지는 켜진 것만.
	function renderStatusbar() {
		if (!state) return;
		var s = state;
		var chip = function (id, label, on) {
			return '<button class="sb-item' + (on === false ? " off" : "") + '" data-opt="' + id + '">' + (on === true ? ic("check") : "") + label + "</button>";
		};
		var groups = [
			["반영", [
				chip("optHot", "핫리로드", s.hotReload),
				chip("optAuto", "저장하면 컴파일" + (s.autoCompile ? " <b>" + (s.compiler === "ecj" ? "ECJ" : "javac") + "</b>" : ""), s.autoCompile),
				s.mapperHotswap ? chip("optMapper", "매퍼 하나만") : "",
				s.debug ? chip("optDebug", "디버거 <b>" + s.servers.map(function (sv) { return sv.debugPort; }).join(" · ") + "</b>") : ""
			]],
			["기동", [
				chip("selHeap", s.heapMb ? "힙 <b>" + fmtMb(s.heapMb) + "</b>" : "힙 상한 없음"),
				s.fastJvm ? chip("optFast", "빠른 JVM") : "",
				s.skipScan ? chip("optSkipScan", "클래스 탐색 건너뜀") : "",
				s.staggerStart ? chip("optStagger", "차례 기동") : "",
				s.profileStart ? chip("optProfile", "기동 표본") : ""
			]],
			["앱", [
				s.smallPool ? chip("optPool", "DB 연결 1개") : "",
				s.noSchedule ? chip("optSchedule", "예약 작업 멈춤") : "",
				s.lazyInit ? chip("optLazy", "지연 초기화") : "",
				s.keepSession ? chip("optSession", "로그인 유지") : ""
			]]
		];
		var html = groups.map(function (g) {
			var items = g[1].join("");
			return items ? '<span class="sb-group"><span class="sb-label">' + g[0] + "</span>" + items + "</span>" : "";
		}).join("");
		// 메모리가 올 때마다 불리므로 바뀐 때만 다시 그린다 (누르는 중에 단추가 바뀌지 않게)
		if ($("sbOpts").innerHTML !== html) $("sbOpts").innerHTML = html;
		if (memSnap) {
			var d = memSnap.daemon, l = memSnap.launcher;
			$("sbMem").innerHTML = '<span class="sb-label">상주 컴파일러</span><b>' + (d.privateMb ? fmtMb(d.privateMb) : "쉬는 중") +
				'</b><span class="sb-label">실행기</span><b>' + fmtMb(l.privateMb) + "</b>";
		}
	}

	// 상태 표시줄 칩 → 설정의 그 칸을 보여 주고 잠깐 테두리를 띄운다
	/* ---------- 설정 › 업데이트 › 변경 기록 ---------- */

	// 실행 파일에 묻은 CHANGELOG.md(지금 판까지) 위에, 새 판이 있으면 GitHub 릴리스 본문(그 판의 CHANGELOG 절)을 얹는다
	var chlogText = null, chlogAll = false, chlogKey = "";
	invoke("changelog").then(function (t) { chlogText = t; chlogKey = ""; if (state) renderChangelog(state); });
	// 「## 0.7.0 · 2026-10-28」 아래 「- 」 줄 → [{ ver, date, items }]
	function parseChangelog(text) {
		var out = [], cur = null;
		(text || "").split(/\r?\n/).forEach(function (line) {
			var h = /^##\s+v?(\d+(?:\.\d+)+)\s*(?:·\s*(.*))?$/.exec(line.trim());
			if (h) { cur = { ver: h[1], date: (h[2] || "").trim(), items: [] }; out.push(cur); return; }
			if (!cur) return;
			var li = /^\s*[-*]\s+(.*)$/.exec(line);
			if (li) cur.items.push(li[1]);
			else if (line.trim() && cur.items.length) cur.items[cur.items.length - 1] += " " + line.trim();
		});
		return out;
	}
	function mdInline(t) {
		return esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
	}
	// 2026.10.29 : 항목 하나가 문장 여럿인 문단이라 벽처럼 보였다 — 첫 문장을 제목으로, 나머지를 접힌 설명으로 나눈다.
	// 「」 · 백틱 안과 숫자 사이(0.2.0 · poi-3.9.jar)의 마침표에서는 끊지 않는다
	function splitItem(t) {
		var depth = 0, tick = false;
		for (var i = 0; i < t.length; i++) {
			var c = t[i];
			if (c === "`") tick = !tick;
			else if (tick) continue;
			else if (c === "「") depth++;
			else if (c === "」") depth = Math.max(0, depth - 1);
			else if (c === "." && !depth && (i + 1 === t.length || t[i + 1] === " ") && !/\d/.test(t[i - 1] || "")) {
				return [t.slice(0, i + 1), t.slice(i + 1).trim()];
			}
		}
		return [t, ""];
	}
	function chlogItem(t) {
		var p = splitItem(t);
		return '<li class="it"><b>' + mdInline(p[0]) + "</b>" +
			(p[1] ? '<button class="tog" type="button">자세히 ▸</button><div class="rest">' + mdInline(p[1]) + "</div>" : "") + "</li>";
	}
	function renderChangelog(s) {
		var box = $("chlog");
		if (!box || chlogText == null) return;
		var rel = s.update.release;
		var key = (rel ? rel.version + rel.notes.length : "") + "|" + chlogAll;
		if (key === chlogKey) return;   // 상태가 3초마다 와도 다시 그리지 않는다 (펼친 것이 접히지 않게)
		chlogKey = key;
		var list = parseChangelog(chlogText);
		if (rel && !list.some(function (x) { return x.ver === rel.version; })) {
			var fresh = parseChangelog(rel.notes)[0] || { ver: rel.version, date: "", items: [] };
			// 릴리스 본문에 판 제목이 없으면 「- 」 줄만 모은다
			if (!fresh.items.length) fresh.items = rel.notes.split(/\r?\n/).map(function (l) { var m = /^\s*[-*]\s+(.*)$/.exec(l); return m && m[1]; }).filter(Boolean);
			fresh.ver = rel.version;
			fresh.isNew = true;
			list.unshift(fresh);
		}
		var shown = chlogAll ? list : list.slice(0, 4);
		box.innerHTML = shown.map(function (x, k) {
			var tag = x.isNew ? '<span class="k new">새 판</span>' : x.ver === s.version ? '<span class="k">지금</span>' : "";
			return "<details" + (k === 0 ? " open" : "") + ' data-ver="' + esc(x.ver) + '"><summary>' + esc(x.ver) + tag +
				'<span class="date">' + esc(x.date) + (x.items.length ? (x.date ? " · " : "") + x.items.length + "가지" : "") + "</span></summary><ul>" +
				(x.items.length ? x.items.map(chlogItem).join("")
					: '<li>변경 내용이 없습니다. <a href="#" data-page>릴리스 페이지</a></li>') + "</ul></details>";
		}).join("") + (list.length > 4 ? '<button class="more" type="button">' + (chlogAll ? "최근 판만" : "이전 판 " + (list.length - 4) + "개 더 보기") + "</button>" : "");
		var more = box.querySelector(".more");
		if (more) more.onclick = function () { chlogAll = !chlogAll; renderChangelog(state); };
		[].forEach.call(box.querySelectorAll(".tog"), function (b) {
			b.onclick = function () { var open = b.parentNode.classList.toggle("open"); b.textContent = open ? "접기 ▾" : "자세히 ▸"; };
		});
		[].forEach.call(box.querySelectorAll("[data-page]"), function (a) {
			a.onclick = function (e) { e.preventDefault(); invoke("open", { target: rel ? rel.page : "https://github.com/a7garden/tomcatrun/releases" }); };
		});
	}
	function openChangelog() {
		openSettings("setUpdate");
		var first = $("chlog").querySelector("details");
		if (first) first.open = true;
	}

	/* ---------- 시작하기 ---------- */

	// 1) 이클립스 작업 공간을 찾으면 서버를 고르고 「가져오기」 한 번 — 프로젝트 · 포트 · 톰캣 폴더 · 의존 jar 까지
	// 2) 못 찾으면 「프로젝트 폴더 고르기」 한 번 — 의존 jar 는 이클립스 배포본 또는 Maven 으로 알아서
	var setupAuto = false;   // 처음 켰을 때 한 번만 저절로 띄운다
	function setupClose() { $("setupScrim").hidden = true; }
	function setupActs(list) {
		var box = $("setupActs");
		box.innerHTML = "";
		list.forEach(function (a) {
			var b = document.createElement("button");
			b.className = "btn " + (a.cls || "");
			b.textContent = a.label;
			b.disabled = !!a.disabled;
			b.onclick = a.run;
			box.appendChild(b);
		});
	}
	function setupBusy(msg) {
		$("setupBody").innerHTML = "<p>" + esc(msg) + "</p>";
		setupActs([]);
	}
	function tomcatRow() {
		var tc = state && state.checks.filter(function (c) { return c.key === "tomcat"; })[0];
		return tc && !tc.ok ? '<div class="tc"><span>톰캣 8.5 를 찾지 못했습니다 · ' + esc(tc.detail) + '</span><button class="btn sm" data-tc>톰캣 폴더 고르기</button></div>' : "";
	}
	function bindTomcat() {
		var b = $("setupBody").querySelector("[data-tc]");
		if (!b) return;
		b.onclick = function () {
			invoke("pick_dir", { title: "톰캣 8.5 폴더 고르기 (bin/bootstrap.jar 가 있는 곳)" }).then(function (dir) {
				if (!dir) return;
				var paths = Object.assign({}, state.paths, { tomcatHome: dir });
				invoke("set_paths", { paths: paths }).then(function () { showToast("톰캣 폴더를 정했습니다"); setTimeout(openSetup, 300); })
					.catch(function (e) { showError(String(e)); });
			});
		};
	}
	function firstEmpty() {
		var k = state.servers.findIndex(function (sv) { return !sv.project; });
		return k < 0 ? 0 : k;
	}
	function setupFolder() {
		invoke("pick_project", { start: "" }).then(function (found) {
			if (!found.length) return;
			var go1 = function (dir) {
				setupBusy("프로젝트를 정하고 의존 jar 를 준비하는 중...");

	function setupWorkspace() {

	// 옮길 수 있는 JNDI 항목 (가리키는 전역 설정이 없는 링크는 뺀다)
	function jndiOf(sv) { return (sv.naming || []).filter(function (n) { return !n.missing; }); }
	function setupShow(list) {
		var servers = [];
		list.forEach(function (w) { w.servers.forEach(function (sv) { servers.push({ ws: w.path, sv: sv }); }); });
		if (!servers.length) {
			$("setupBody").innerHTML = "<p>이클립스 작업 공간을 찾지 못했습니다.<br>프로젝트 폴더(<code>src/main/webapp</code> 이 있는 폴더)를 고르면 의존 jar 까지 알아서 준비합니다.</p>" + tomcatRow();
			bindTomcat();
			setupActs([
				{ label: "이클립스 작업 공간 고르기", cls: "ghost left", run: setupWorkspace },
				{ label: "나중에", run: setupClose },
				{ label: "프로젝트 폴더 고르기", cls: "primary", run: setupFolder }
			]);
			return;
		}
		var html = "<p>이클립스에서 쓰던 톰캣 서버를 찾았습니다. 고른 서버의 프로젝트 · 포트 · 톰캣 폴더 · 의존 jar · 자바(핫리로드를 끌 때)를 그대로 가져옵니다. 이클립스 설정은 바꾸지 않습니다.</p>";
		var lastWs = "";
		servers.forEach(function (x, k) {
			if (x.ws !== lastWs) { html += (lastWs ? "</ul>" : "") + '<div class="ws">' + esc(x.ws) + '</div><ul class="pick">'; lastWs = x.ws; }
			var ok = !!x.sv.project;
			var jn = jndiOf(x.sv).length;
			html += '<li class="' + (ok ? "" : "off") + '"><input type="checkbox" data-k="' + k + '"' + (ok ? " checked" : " disabled") + "><b>" + esc(x.sv.name) + "</b>" +
				'<span class="meta">' + (ok ? esc(baseName(x.sv.project)) + " · " + x.sv.httpPort + esc(x.sv.contextPath || "") + (x.sv.jars ? " · jar " + x.sv.jars + "개" : " · jar 없음 (Maven 으로 받기)") + (jn ? " · JNDI " + jn + "개" : "") + (x.sv.java ? " · 자바 " + x.sv.javaVersion : "") : "프로젝트 폴더를 찾지 못함") + "</span>" +
				(ok && x.sv.warnings.length ? '<div class="warns">' + x.sv.warnings.map(function (w) {
					// {base} 는 가져올 때 그 서버의 톰캣 설정 폴더로 바뀐다
					return "<div>" + ic("warn") + "<span>" + esc(w.split("{base}").join("<서버 폴더>/base")) + "</span></div>";
				}).join("") + "</div>" : "") + "</li>";
		});
		html += "</ul>" + '<div class="jndi" id="setupJndi" hidden></div>' + tomcatRow();
		$("setupBody").innerHTML = html;
		bindTomcat();
		// JNDI 설정 옮기기 — DB 계정 · 비밀번호가 실행기 폴더로 복사되므로 기본은 꺼 둔다. 고른 서버가 바뀌면 개수를 다시 센다.
		var jndiOn = false;
		var drawJndi = function () {
			var box = $("setupJndi");
			var list = [], lost = [];
			[].forEach.call($("setupBody").querySelectorAll("input[data-k]"), function (c) {
				if (!c.checked) return;
				var sv = servers[+c.getAttribute("data-k")].sv;
				jndiOf(sv).forEach(function (n) { list.push(n.name); });
				(sv.naming || []).forEach(function (n) { if (n.missing) lost.push(n.name); });
			});
			box.hidden = !list.length;
			if (!list.length) return;
			box.innerHTML = '<label><input type="checkbox" id="setupJndiOn"' + (jndiOn ? " checked" : "") + "> JNDI 설정 " + list.length + "개도 옮기기</label>" +
				'<div class="names">' + esc(list.join(" · ")) + "</div>" +
				"<p>이클립스 서버 설정의 DB 계정 · 비밀번호가 그 서버의 톰캣 설정 폴더(<code>conf/Catalina/localhost/context.xml.default</code>)에 그대로 복사됩니다. 다른 서버와 저장소에는 들어가지 않습니다.</p>" +
				"<p>옮기지 않으면 앱이 이 이름을 찾지 못해 기동이 실패할 수 있습니다.</p>" +
				(lost.length ? "<p>가리키는 전역 설정이 없어 옮기지 않는 링크: " + esc(lost.join(" · ")) + "</p>" : "");
			$("setupJndiOn").onchange = function () { jndiOn = this.checked; };
		};
		[].forEach.call($("setupBody").querySelectorAll("ul.pick li:not(.off)"), function (li) {
			li.onclick = function (e) { if (e.target.tagName !== "INPUT") { var c = li.querySelector("input"); c.checked = !c.checked; } drawJndi(); };
		});
		drawJndi();
		setupActs([
			{ label: "폴더 직접 고르기", cls: "ghost left", run: setupFolder },
			{ label: "나중에", run: setupClose },
			{ label: "가져오기", cls: "primary", run: function () {
				var picked = [].filter.call($("setupBody").querySelectorAll("input[data-k]"), function (c) { return c.checked; }).map(function (c) { return servers[+c.getAttribute("data-k")]; });
				if (!picked.length) return;
				// 작업 공간이 여럿이면 처음 고른 서버의 작업 공간에서 가져온다
				var ws = picked[0].ws;
				var ids = picked.filter(function (x) { return x.ws === ws; }).map(function (x) { return x.sv.id; });
				setupBusy("가져오는 중... 의존 jar 를 옮기고 있습니다.");
				invoke("eclipse_import", { ws: ws, ids: ids, naming: jndiOn }).then(function (msg) { setupClose(); showToast(msg); })
					.catch(function (e) { setupClose(); showError(String(e)); });
			} }
		]);
	}
	function openSetup() {

		$("setupScrim").hidden = false;
		setupBusy("이클립스 설정을 찾는 중...");

	$("setupScrim").addEventListener("keydown", function (e) { if (e.key === "Escape") setupClose(); });
	$("srvImport").onclick = function () { openSetup(); };

	/* ---------- 설정 (모달) ---------- */

	var setSec = "setServers";   // 마지막에 본 구획 — 다시 열면 그 자리
	function openSettings(id) {

		showSetSec(id || setSec);

	function showSetSec(id) {

	// 모달 뒤의 알림 줄은 가려지므로 저장 실패 같은 오류는 모달 안에도 띄운다
	function renderSetErr() {

	// 입력칸에서 끌다가 바깥에서 놓아도 닫히지 않게 — 누르기 시작한 곳이 바깥일 때만 닫는다

	/* ---------- 로그 · 반영 기록 ---------- */

	function push(name, item) {
		var arr = store[name];
		arr.push(item);
		if (arr.length > MAX) arr.splice(0, arr.length - MAX);
	}

	function matches(it) {
		if (tab === "events" && evSrv >= 0 && it.srv !== evSrv) return false;
		if ($("onlyErr").checked && it.kind !== "err") return false;
		var q = $("filter").value.trim().toLowerCase();
		return !q || it.text.toLowerCase().indexOf(q) >= 0;
	}

	// 반영 기록 한 줄을 구분 · 내용 · 걸린 시간으로 나눈다 (실행기가 남기는 문구를 그대로 읽는다)
	function eventInfo(it) {
		var t = it.text, m;
		var r = { label: "기록", cls: "", msg: t, dur: "" };
		if (it.src === "compile") {
			r.label = it.kind === "err" ? "컴파일 실패" : "컴파일";
			r.cls = it.kind === "err" ? "crit" : "ok";
			r.msg = t.replace(/^(전체 )?컴파일 (완료|실패|더함) · /, "").replace(/^(\d+)개 · /, "$1개 파일 · ");
		} else if (it.src === "deps") {
			r.label = "의존 jar";
			r.cls = it.kind === "err" ? "crit" : it.kind === "ok" ? "ok" : "";
		} else if (it.kind === "live") {
			r.cls = "info";
			if ((m = /^바로 반영 · (.*)$/.exec(t))) { r.label = "바로 반영"; r.msg = m[1]; }
			else if ((m = /^매퍼 (.*)$/.exec(t))) { r.label = "매퍼"; r.msg = m[1]; }
		} else if (it.kind === "hot") {
			r.cls = "hot";
			if ((m = /^매퍼를 다시 읽었습니다 · (.*)$/.exec(t))) { r.label = "매퍼 다시 읽음"; r.msg = m[1]; }
			else if ((m = /^(자바 교체|Spring 반영) · (.*)$/.exec(t))) { r.label = m[1]; r.msg = m[2]; }
			else { r.label = "클래스 교체"; r.msg = t.replace(/^HOTSWAP AGENT:\s*[\d:.]+\s+\w+\s+\([^)]*\)\s*-\s*/, ""); }
		} else if (it.kind === "ok") {
			r.cls = "ok";
			if ((m = /^기동 ([\d.]+초) · (.*)$/.exec(t))) { r.label = "기동 완료"; r.dur = m[1]; r.msg = m[2]; }
			else r.label = "완료";
		} else if (it.kind === "warn") {
			r.cls = "warn";
			if ((m = /^재시작해야 반영 · (.*)$/.exec(t))) { r.label = "재시작 필요"; r.msg = m[1]; }
			else r.label = "알림";
		} else if (it.kind === "err") {
			r.label = "오류";
			r.cls = "crit";
		}
		if (!r.dur && (m = / · ([\d.]+초)(?=[ (]|$)/.exec(r.msg))) {
			r.dur = m[1];
			r.msg = r.msg.slice(0, m.index) + r.msg.slice(m.index + m[0].length);
		}
		return r;
	}

	// 파일 경로 · 이름 조각만 고정폭으로 감싸고, 「/」 뒤에서만 줄을 나눈다
	var PATH_RE = /[\w.\-\/\\$]*[\w\-$]\.(java|jsp|js|css|xml|properties|html|sql|jar|json|tld)\b(:\d+)?/g;
	function pathify(t) {
		var out = "", last = 0, m;
		PATH_RE.lastIndex = 0;
		while ((m = PATH_RE.exec(t))) {
			out += esc(t.slice(last, m.index)) + '<span class="mono">' + esc(m[0]).replace(/\//g, "/<wbr>") + "</span>";
			last = m.index + m[0].length;
		}
		return out + esc(t.slice(last));
	}

	function eventEl(it) {
		var r = eventInfo(it);
		var d = document.createElement("div");
		d.className = "ev" + (r.cls === "crit" ? " err" : r.cls === "warn" ? " warn" : "") + (it.open ? " open" : "");
		d._it = it;   // 우클릭 메뉴가 읽는다
		// 펼친 상태는 항목에 둔다 — 찾기 · 거르기로 다시 그려도 펼친 줄이 접히지 않는다.
		// 글자를 드래그로 고른 때는 접고 펴지 않는다 (경로를 복사하려다 줄이 접히지 않도록)
		d.onclick = function () {
			if (!d.classList.contains("fold") || String(window.getSelection())) return;
			it.open = !it.open;
			d.classList.toggle("open", it.open);
		};
		d.innerHTML = '<span class="t num">' + fmtTime(it.at) + "</span>" +
			'<span class="who">' + (it.srv != null && state ? esc(state.servers[it.srv].name) : "실행기") + "</span>" +
			'<span class="k ' + r.cls + '">' + esc(r.label) + "</span>" +
			'<span class="m">' + pathify(r.msg) + "</span>" +
			'<span class="d num">' + esc(r.dur) + "</span>";
		// 컴파일 실패 줄 아래에 그 컴파일의 오류 줄을 단다 (누르면 편집기로 연다)
		if (it.errs && it.errs.length) {
			var box = document.createElement("div");
			box.className = "errs";
			it.errs.slice(0, 5).forEach(function (t) {
				var m = SRC_RE.exec(t);
				if (!m) return;
				var a = document.createElement("a");
				a.textContent = baseName(m[1]) + ":" + m[2] + "  " + t.slice(m.index + m[0].length).trim();
				a.title = m[1] + " · 편집기로 열기";
				a.setAttribute("data-file", m[1]);
				a.setAttribute("data-line", m[2]);
				a.onclick = function (e) { e.stopPropagation(); invoke("open_source", { file: m[1], line: parseInt(m[2], 10) }); };
				box.appendChild(a);
			});
			if (it.errs.length > 5) {
				var more = document.createElement("a");
				more.className = "more";
				more.textContent = "외 " + (it.errs.length - 5) + "줄 · 빌드 탭에서 보기";
				more.onclick = function (e) { e.stopPropagation(); go("build"); };
				box.appendChild(more);
			}
			d.appendChild(box);
		}
		return d;
	}

	// 내용이 지금 폭에서 넘치는 줄만 접기 손잡이(.fold)를 단다. 글자 수가 아니라 실제 폭으로 재므로
	// 줄이 화면에 붙은 뒤에, 그리고 창 폭이 바뀔 때마다 다시 잰다. 펼친 줄은 넘치지 않아도 다시 접을 수 있어야 한다
	function markFold(els) {
		[].forEach.call(els, function (d) {
			var m = d.querySelector(".m");
			d.classList.toggle("fold", d.classList.contains("open") || m.scrollWidth > m.clientWidth);
		});
	}
	var foldW = 0;
	new ResizeObserver(function () {
		// 펼치고 접어서 높이만 바뀐 때는 다시 재지 않는다
		if (tab !== "events" || logEl.clientWidth === foldW) return;
		foldW = logEl.clientWidth;
		markFold(logEl.querySelectorAll(".ev"));
	}).observe(logEl);

	function lineEl(it) {
		if (tab === "events") return eventEl(it);
		var d = document.createElement("div");
		d.className = it.kind || (it.src === "app" ? "app" : "");
		d._it = it;   // 우클릭 메뉴가 읽는다
		// 빌드 탭에는 두 서버 줄이 섞이므로 서버 이름을 붙인다
		if (tab === "build" && it.srv != null && state) {
			var g = document.createElement("span");
			g.className = "who";
			g.textContent = state.servers[it.srv].name;
			d.appendChild(g);
		}
		var m = it.kind === "err" && SRC_RE.exec(it.text);
		if (m) {
			d.appendChild(document.createTextNode(it.text.slice(0, m.index)));
			var a = document.createElement("a");
			a.className = "src";
			a.textContent = m[0].slice(0, -1);
			a.title = "편집기로 열기";
			a.setAttribute("data-file", m[1]);
			a.setAttribute("data-line", m[2]);
			a.onclick = function () { invoke("open_source", { file: m[1], line: parseInt(m[2], 10) }); };
			d.appendChild(a);
			d.appendChild(document.createTextNode(it.text.slice(m.index + m[0].length - 1)));
		} else {
			d.appendChild(document.createTextNode(it.text));
		}
		return d;
	}

	// 로그 탭 · SVN · 상태 · 설정은 같은 자리를 나눠 쓴다
	function showPane() {
		var logLike = !!store[tab];
		$("paneLog").hidden = !logLike;
		$("paneSvn").hidden = tab !== "svn";
		$("paneStatus").hidden = tab !== "status";
		$("evSrv").hidden = tab !== "events";
		$("evHead").hidden = tab !== "events";
		$("buildCtl").hidden = tab !== "build";
		$("logFolder").hidden = !/^srv/.test(tab);
		logEl.className = tab === "events" ? "" : "lines";
		if (tab === "svn") svnActivate();
	}

	function emptyText() {
		if (store[tab] && store[tab].length) return "조건에 맞는 줄이 없습니다.";
		if (tab === "events") return "아직 반영 기록이 없습니다. 서버를 켜고 파일을 저장하면 쌓입니다.";
		if (tab === "build") return "아직 컴파일 기록이 없습니다.";
		return "아직 로그가 없습니다.";
	}

	function redraw() {
		if (!store[tab]) return;
		var list = store[tab].filter(matches);
		logEl.textContent = "";
		if (!list.length) {
			var e = document.createElement("div");
			e.className = "empty";
			e.textContent = emptyText();
			logEl.appendChild(e);
			return;
		}
		var frag = document.createDocumentFragment();
		list.slice(-SHOW).forEach(function (it) { frag.appendChild(lineEl(it)); });
		logEl.appendChild(frag);
		if (tab === "events") markFold(logEl.children);
		if ($("follow").checked) logEl.scrollTop = logEl.scrollHeight;
	}

	function renderTabs() {
		document.querySelectorAll(".tab").forEach(function (b) {
			var name = b.getAttribute("data-tab");
			b.classList.toggle("on", name === tab);
			b.setAttribute("aria-selected", name === tab ? "true" : "false");
			var n = b.querySelector(".n");
			n.textContent = unread[name] ? (unread[name] > 999 ? "999+" : unread[name]) : "";
			n.className = "n" + (unreadErr[name] ? " bad" : unread[name] ? " new" : "");
		});
	}

	function isEvent(l) {
		// HotswapAgent 원문 줄은 서버 로그에만 — 반영 기록에는 실행기가 묶어 남기는 「자바 교체」 · 「Spring 반영」 이 간다
		if (l.kind === "hot" || l.kind === "live") return l.src !== "tomcat";
		// 톰캣의 「Server startup in」 은 실행기가 단계별로 다시 남기므로 한 번만 보인다
		if (l.kind === "ok") return l.src !== "tomcat";
		if (l.src === "app") return true;
		if (l.src === "deps") return /^의존 jar/.test(l.text);
		return l.src === "compile" && /^(컴파일|전체 컴파일)/.test(l.text);
	}

	var early = [];   // 뼈대가 서기 전에 온 로그
	function onLogs(lines) {
		if (!built) { early = early.concat(lines); return; }
		var now = Date.now(), added = [], compiled = false;
		function put(name, it) {
			if (!store[name]) return;
			push(name, it);
			if (name === tab) added.push(it);
			else {
				unread[name]++;
				if (it.kind === "err") unreadErr[name] = true;
			}
		}
		lines.forEach(function (l) {
			var it = { srv: l.srv, src: l.src, kind: l.kind, text: l.text, at: now };
			// 오류 줄(파일:줄:)은 컴파일 요약 줄보다 먼저 온다 — 모아 두었다가 요약 줄에 붙인다
			if (l.src === "compile" && l.srv != null) {
				if (l.kind === "err" && SRC_RE.test(l.text)) (errBuf[l.srv] = errBuf[l.srv] || []).push(l.text);
				else if (/^(전체 )?컴파일 (완료|실패)/.test(l.text)) {
					lastErrs[l.srv] = l.kind === "err" ? (it.errs = errBuf[l.srv] || []) : [];
					errBuf[l.srv] = [];
					compiled = true;
				}
			}
			if (l.src === "compile" || l.src === "deps") put("build", it);
			else if (l.srv != null) put("srv" + l.srv, it);
			if (isEvent(l)) put("events", it);
		});
		var shown = added.filter(matches);
		if (shown.length && logEl.querySelector(".empty")) logEl.textContent = "";
		var frag = document.createDocumentFragment();
		shown.forEach(function (it) { frag.appendChild(lineEl(it)); });
		var fresh = [].slice.call(frag.children);
		logEl.appendChild(frag);
		if (tab === "events") markFold(fresh);
		while (logEl.childNodes.length > SHOW) logEl.removeChild(logEl.firstChild);
		if ($("follow").checked) logEl.scrollTop = logEl.scrollHeight;
		renderTabs();
		if (compiled) renderAlerts();
	}

	/* ---------- 작은 메뉴 (서버 「바로가기」 · 재시작 목록 「무시…」 · 우클릭) ---------- */

	var menu = $("menu");
	var menuAt = null;   // 마지막으로 연 자리 — 우클릭 메뉴의 「…」 항목이 같은 자리에 다음 메뉴를 연다
	// at : 단추(그 아래 오른쪽 끝에 붙인다) 또는 { x, y }(우클릭한 자리)
	// items : [{ label, sub(아래 흐린 줄 · 없어도 된다), run, disabled }] · { sep: true } 는 구분선
	function openMenu(at, items) {
		var btn = at.nodeType ? at : null;
		if (btn && !menu.hidden && menu._for === btn) { closeMenu(); return; }
		menu.innerHTML = items.map(function (it, k) {
			if (it.sep) return "<hr>";
			return '<button role="menuitem" data-k="' + k + '"' + (it.disabled ? " disabled" : "") + ">" + esc(it.label) +
				(it.sub ? "<small>" + esc(it.sub) + "</small>" : "") + "</button>";
		}).join("");
		[].forEach.call(menu.querySelectorAll("button"), function (b) {
			// 먼저 닫고 부른다 — 항목이 다음 메뉴를 열 수 있다. 바깥 누르기로 보면 새 메뉴까지 닫히므로 위로 올리지 않는다
			b.onclick = function (ev) { ev.stopPropagation(); closeMenu(); items[+b.getAttribute("data-k")].run(); };
		});
		menu.hidden = false;
		var w = menu.offsetWidth, h = menu.offsetHeight, top, left;
		if (btn) {
			var r = btn.getBoundingClientRect();
			top = r.bottom + 4;
			left = r.right - w;
		} else {
			// 오른쪽 · 아래가 모자라면 마우스 왼쪽 · 위로 편다 (Windows 메뉴와 같다)
			top = at.y + h > window.innerHeight - 8 ? at.y - h : at.y;
			left = at.x + w > window.innerWidth - 8 ? at.x - w : at.x;
		}
		menu.style.top = Math.max(8, Math.min(top, window.innerHeight - h - 8)) + "px";
		menu.style.left = Math.max(8, Math.min(left, window.innerWidth - w - 8)) + "px";
		menu._for = btn;
		menuAt = at;
		var first = menu.querySelector("button:not(:disabled)");
		if (first) first.focus();
	}
	function closeMenu() { menu.hidden = true; menu._for = null; }
	document.addEventListener("click", function (e) { if (!menu.contains(e.target)) closeMenu(); });
	window.addEventListener("blur", function () { closeMenu(); });
	document.addEventListener("keydown", function (e) {
		if (e.key === "Escape") closeMenu();
		if (!menu.hidden && (e.key === "ArrowDown" || e.key === "ArrowUp") && menu.querySelector("button:not(:disabled)")) {
			var items = [].slice.call(menu.querySelectorAll("button:not(:disabled)")), k = items.indexOf(document.activeElement);
			k = (k + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length;
			items[k].focus();
			e.preventDefault();
		}
		// Ctrl+, : 설정
		if (e.ctrlKey && e.key === "," && $("quitScrim").hidden) {
			openSettings();
			e.preventDefault();
		}
		// Ctrl+F : 로그 탭에서 찾기 칸으로
		if (e.ctrlKey && (e.key === "f" || e.key === "F") && store[tab] && $("setScrim").hidden) {
			$("filter").focus();
			$("filter").select();
			e.preventDefault();
		}
	});

	/* ---------- 우클릭 메뉴 ----------
	   2026-10-28 : 브라우저 기본 메뉴(뒤로 · 새로 고침 · 인쇄 · 검사)를 늘 막는다. 「새로 고침」을 누르면 쌓아 둔 로그 · 고른 파일이 날아간다.
	   입력칸에서만 기본 메뉴(잘라내기 · 붙여넣기 · 맞춤법)를 남긴다. 검사는 디버그 빌드에서 F12 로 연다.
	   자리마다 항목을 만드는 함수는 CTX 표에 둔다 — 위에서부터 처음 맞는 자리 하나만 쓰므로 안쪽 자리를 위에 둔다. */

	// PATH_RE 와 같은 확장자 — 드라이브 글자까지 잡는다 (PATH_RE 는 「C:」 를 떼고 잡는다)
	var FILE_RE = /(?:[A-Za-z]:)?[\w.\-\/\\$]*[\w\-$]\.(?:java|jsp|js|css|xml|properties|html|sql|jar|json|tld)\b/g;
	function isAbs(p) { return /^[A-Za-z]:[\\\/]/.test(p); }
	// 프로젝트 기준 경로 → 그 서버 프로젝트의 절대 경로. 이미 절대 경로면 그대로, 서버를 모르면 null
	function fullPath(srv, p) {
		p = String(p).replace(/\\/g, "/");
		if (isAbs(p)) return p;
		var sv = state && srv != null ? state.servers[srv] : null;
		return sv ? sv.project.replace(/\\/g, "/").replace(/\/+$/, "") + "/" + p : null;
	}
	// 파일 하나를 두고 하는 일. gone : 지운 파일이라 편집기로 열 수 없다 (탐색기는 남은 부모 폴더를 연다)
	function fileItems(file, line, gone) {
		var win = file.replace(/\//g, "\\");
		return [
			{ label: line > 1 ? "편집기로 " + line + "번째 줄 열기" : "편집기로 열기", disabled: gone, run: function () { invoke("open_source", { file: file, line: line || 1 }); } },
			{ label: "탐색기에서 보기", run: function () { invoke("reveal", { path: file }); } },
			{ label: "경로 복사", sub: win, run: function () { copyText(win, baseName(file) + " 경로"); } }
		];
	}
	function copyLine(text) { return { label: "줄 복사", run: function () { copyText(text, "줄"); } }; }
	// 무시 범위 고르기 — 같은 자리에 다음 메뉴를 연다
	function ignoreItem(rel) { return { label: "저장 감시에서 빼기…", run: function () { openMenu(menuAt, ignoreChoices(rel)); } }; }

	function srvMenu(card) {
		var i = +card.getAttribute("data-srv"), sv = state.servers[i], st = sv.status, out = [];
		if (st === "stopped") out.push({ label: "시작", disabled: sv.depsBusy, run: function () { hideError(); call("start", { srv: i }); } });
		else out.push({ label: "재시작", disabled: st === "stopping", run: function () { hideError(); call("restart", { srv: i }); } },
			{ label: "중지", disabled: st === "stopping", run: function () { call("stop", { srv: i }); } });
		// 바로가기가 없으면 아래 「설정에서 이 서버」 가 같은 곳으로 데려간다
		if (sv.links.length) out = out.concat([{ sep: true }], linkItems(i).map(function (it) { return { label: "바로가기 · " + it.label, sub: it.sub, run: it.run }; }));
		return out.concat([{ sep: true },
			{ label: sv.name + " 로그 보기", run: function () { go("srv" + i); } },
			{ label: "톰캣 로그 폴더 열기", run: function () { invoke("open", { target: sv.catalinaBase + "/logs" }); } },
			{ label: "프로젝트 폴더 열기", sub: sv.project, run: function () { invoke("open", { target: sv.project }); } },
			{ label: "설정에서 이 서버", run: function () { openSrvForm(i); } }]);
	}
	// 반영 기록 한 줄 — 내용에 경로가 있으면 그 파일 (「바로 반영」 은 파일 이름만 남기므로 경로가 없다)
	function eventMenu(d) {
		var it = d._it, out = [], seen = {}, files = [], m;
		if (!it) return [];
		FILE_RE.lastIndex = 0;
		while ((m = FILE_RE.exec(it.text))) {
			var p = m[0].replace(/\\/g, "/"), full = /\//.test(p) && fullPath(it.srv, p);
			if (full && !seen[full]) { seen[full] = true; files.push({ rel: p, file: full }); }
		}
		if (files.length === 1) {
			out = fileItems(files[0].file, 1);
			if (!isAbs(files[0].rel)) out.push(ignoreItem(files[0].rel));
		} else if (files.length) {
			// 여러 파일이면 파일마다 「편집기로 열기」 한 줄과 경로를 한꺼번에 복사하는 줄
			out = files.slice(0, 8).map(function (f) { return { label: "편집기로 열기 · " + baseName(f.file), sub: f.rel, run: function () { invoke("open_source", { file: f.file, line: 1 }); } }; });
			out.push({ label: "경로 " + files.length + "개 복사", run: function () {
				copyText(files.map(function (f) { return f.file.replace(/\//g, "\\"); }).join("\r\n"), "경로 " + files.length + "개");
			} });
		}
		if (out.length) out.push({ sep: true });
		out.push(copyLine(it.text));
		return out;
	}
	// 서버 로그 · 빌드 한 줄 — 컴파일 오류면 그 파일 그 줄
	function lineMenu(d) {
		var it = d._it;
		if (!it) return [];
		var m = it.kind === "err" && SRC_RE.exec(it.text);
		return (m ? fileItems(m[1], parseInt(m[2], 10)).concat([{ sep: true }]) : []).concat([copyLine(it.text)]);
	}
	// 알림 줄 재시작 목록 — 「자바 클래스」 · 매퍼 이름처럼 경로가 아닌 것은 무시 범위만
	function pendMenu(li) {
		var path = li.getAttribute("data-path"), srv = +li.getAttribute("data-srv");
		var out = /\//.test(path) && /\.\w+$/.test(path) ? fileItems(fullPath(srv, path), 1).concat([{ sep: true }]) : [];
		return out.concat(ignoreChoices(path).map(function (c) { return { label: "무시 · " + c.label, sub: c.sub, run: c.run }; }));
	}
	// 버전 관리 「Changes」 한 줄
	function vcsRowMenu(row) {
		var p = row.getAttribute("data-p"), st = svn.data[K()];
		var it = st && st.items.filter(function (x) { return x.path === p; })[0];
		if (!it) return [];
		var ck = svn.checked[K()] || (svn.checked[K()] = {});
		var out = fileItems(rootOf(svn.srv) + "/" + p, 1, it.code === "D" || it.code === "!");
		out.push({ sep: true }, { label: ck[p] ? "Commit 대상에서 빼기" : "Commit 대상으로 고르기", run: function () { ck[p] = !ck[p]; svnRender(); } });
		if (!it.dir && p !== ".") {
			if (isGit() ? st.upstream : true) out.push({ label: isGit() ? "Compare with " + st.upstream : "Compare with HEAD", run: function () { svn.sel = p; svnRender(); svnCompareHead(p); } });
			if (it.code !== "?" && it.code !== "A") {
				out.push({ label: "Show log", run: function () { svnFileLog(p); } });
				out.push({ label: "Blame", run: function () { svn.sel = p; svnRender(); svnBlame(p); } });
			}
		}
		// 쓰기는 Allow write 를 켠 서버에서만 — svn.exe 판이 맞지 않으면 잠근 채 까닭을 보인다
		if (canWrite()) {
			var block = writeBlock();
			if (it.conflict) {
				out.push({ sep: true });
				["mine", "theirs", "working"].forEach(function (a) {
					out.push({ label: "Resolve · " + RESOLVE[a][0], disabled: !!block, run: function () { vcsResolve(p, a); } });
				});
			}
			if (it.code !== "?") out.push({ sep: true }, { label: "Revert…", sub: block || "", disabled: !!block, run: function () { vcsRevertAsk([it]); } });
		}
		return out;
	}
	// Log · Incoming 에서 커밋 아래 바뀐 경로 — 작업복사본 밖이면 저장소 경로를 복사할 뿐
	function vcsPathMenu(el) {
		var p = el.getAttribute("data-p");
		if (el.classList.contains("out")) return [{ label: "경로 복사", sub: p, run: function () { copyText(p, "저장소 경로"); } }];
		var gone = el.querySelector(".a").textContent === "D";
		return [{ label: "Diff", run: function () { el.onclick(); } }, { sep: true }].concat(fileItems(rootOf(svn.srv) + "/" + p, 1, gone));
	}
	// 차이 보기 한 줄 — 새 쪽이 지금 내 파일일 때만 그 줄을 편집기로
	function diffMenu(tr) {
		var cell = tr.querySelector("td.s") || tr.lastElementChild, n = +tr.getAttribute("data-n");
		var out = svn.diffFile && n ? [{ label: "편집기로 " + n + "번째 줄 열기", run: function () { invoke("open_source", { file: svn.diffFile, line: n }); } }] : [];
		return out.concat([copyLine(cell.textContent)]);
	}
	// 상태 탭 준비 항목 · 컴파일 오류 위치 링크
	function checkMenu(li) { return fileItems(li.getAttribute("data-path"), 1).slice(1); }   // 폴더도 있으므로 편집기는 빼고
	function srcMenu(a) { return fileItems(a.getAttribute("data-file"), parseInt(a.getAttribute("data-line"), 10) || 1); }

	var CTX = [
		["[data-file]", srcMenu],
		[".alert-items li", pendMenu],
		[".ev", eventMenu],
		["#log > div", lineMenu],
		[".svn-diff tr", diffMenu],
		[".svn-list .row", vcsRowMenu],
		[".svn-list .cp", vcsPathMenu],
		[".srv", srvMenu],
		[".checks li[data-path]", checkMenu]
	];
	document.addEventListener("contextmenu", function (e) {
		var t = e.target;
		if (t.closest("input, textarea, select, [contenteditable]")) { closeMenu(); return; }
		e.preventDefault();
		var items = [], sel = String(window.getSelection());
		if (sel.trim()) items.push({ label: "복사", run: function () { copyText(sel, "고른 글자"); } });
		for (var k = 0; k < CTX.length; k++) {
			var el = t.closest(CTX[k][0]);
			if (!el) continue;
			var more = state ? CTX[k][1](el) : [];
			if (more.length && items.length) items.push({ sep: true });
			items = items.concat(more);
			break;
		}
		if (items.length) openMenu({ x: e.clientX, y: e.clientY }, items); else closeMenu();
	});

	/* ---------- 버전 관리 (SVN · Git) ---------- */

	// kind : svn · git — 서버마다 「설정 › 버전 관리」에서 정한다. 둘 다 쓰면 도구 줄에서 고른다.
	// view : local(Changes) · incoming(Incoming) · log(Log)
	//   SVN  Changes 는 .svn/wc.db 만 읽고, 뒤의 둘은 저장소에 읽기 요청을 보낸다
	//   Git  모두 로컬 .git 만 읽는다. Incoming 은 마지막으로 fetch 해 둔 원격 추적 브랜치와 견준다
	// 쓰기(Commit · Update · Revert · Resolve · 리비전 되돌리기)는 「Allow write」를 켠 서버에서 확인 창을 거쳐서만 (2026-10-29~).
	//   끈 서버는 전처럼 명령을 복사만 해 준다.
	// 용어는 영문 표준 용어 (DESIGN.md 「버전 관리 용어」) — TortoiseSVN · VS Code 와 같은 낱말로 찾게 한다
	// 캐시(data · stale · checked · remote)는 「서버:종류」 열쇠로 나눈다
	var svn = { srv: 0, kind: "svn", view: "local", data: {}, stale: {}, sel: null, checked: {}, timer: null, loading: false,
		remote: {}, logRel: "", selRev: null, retry: null, sig: "",
		busy: false,        // 쓰기가 도는 중 — 단추를 잠근다
		blameFor: null,     // Blame 을 받는 중인 파일 — 그 사이 다른 것을 고르면 결과를 버린다
		diffFile: null };   // Diff 의 새 쪽이 지금 내 파일이면 그 절대 경로 — 우클릭 「편집기로 이 줄 열기」
	var KIND_NAME = { svn: "SVN", git: "Git" };
	// Commit 후보로 처음부터 골라 두는 것 — Unversioned · Missing · Conflicted 는 사람이 보고 고른다
	var SVN_DEFAULT = { M: true, A: true, D: true, P: true };
	// Resolve 방법 — [단추 이름, 확인 창 설명]
	var RESOLVE = {
		mine: ["Use mine", "내 것(mine)으로 파일을 덮고 해결로 표시합니다. 저장소에서 들어온 변경은 이 파일에서 버려집니다."],
		theirs: ["Use theirs", "저장소 것(theirs)으로 파일을 덮고 해결로 표시합니다. 내가 고친 내용은 이 파일에서 버려집니다."],
		working: ["Mark as resolved", "지금 파일 그대로 해결로 표시합니다. 파일 안의 충돌 표시(<<<<<<< · ======= · >>>>>>>)를 다 정리했는지 먼저 보세요."]
	};

	function K() { return svn.srv + ":" + svn.kind; }
	function kindsOf(i) { return state && state.servers[i] ? state.servers[i].vcsKinds || [] : []; }
	function vcsOf(i) { return state.servers[i].vcs; }
	function isGit() { return svn.kind === "git"; }
	function canWrite() { var sv = state && state.servers[svn.srv]; return !!(sv && sv.vcs.write); }

	/* --- Commit message 자동 생성 · 규칙 (2026.10.29~) ---
	   생성 명령은 「설정 › 경로」, 규칙은 서버마다 「설정 › 버전 관리」. 규칙은 막지 않고 알린다 —
	   칸 아래에 까닭을 보이고, 어긴 채 Commit · 복사하려 하면 확인 창에서 「그래도 …」를 한 번 더 고른다.
	   검사는 늘 실행기에 묻는다. 화면과 실행기의 정규식 엔진이 다르면 화면은 통과인데 Commit 이 거절되는 일이 생긴다. */

	function msgCheck(done) {
		var msg = $("svnMsg").value.trim(), srv = svn.srv;
		if (!msg) { svn.msgProblems = []; msgWarn(); if (done) done([]); return; }
		invoke("check_commit_msg", { srv: srv, msg: msg }).then(function (p) {
			if (srv !== svn.srv) return;
			svn.msgProblems = p;
			msgWarn();
			if (done) done(p);
		}).catch(function (e) { showError(String(e)); });
	}
	function msgWarn() {
		var p = svn.msgProblems || [];
		$("svnMsgWarn").hidden = !p.length;
		$("svnMsgWarn").textContent = p.length ? "규칙: " + p.join(" · ") : "";
	}
	$("svnMsg").addEventListener("input", function () {
		clearTimeout(msgCheck.t);
		msgCheck.t = setTimeout(function () { msgCheck(); }, 250);
	});
	// 규칙에 맞으면 바로 next(false), 어긋나면 확인 창에서 「그래도 …」를 고른 뒤 next(true)
	function msgGate(what, next) {
		msgCheck(function (p) {
			if (!p.length) { next(false); return; }
			vcsConfirm({
				title: "Commit message 가 규칙에 맞지 않습니다",
				html: "그래도 " + esc(what) + " 할 수 있습니다. 규칙은 설정 › 버전 관리에서 고칩니다.",
				items: p.map(function (x) { return [x, ""]; }),
				ok: "그래도 " + what,
				run: function () { next(true); }
			});
		});
	}
	$("svnGenMsg").onclick = function () {
		var items = svnChecked();
		if (!items.length) { showError("메시지를 만들 파일을 먼저 고르세요."); return; }
		var go = function () {
			var b = $("svnGenMsg"), srv = svn.srv;
			var reset = function () { b.disabled = false; b.lastChild.textContent = "자동 생성"; };
			b.disabled = true;
			b.lastChild.textContent = "만드는 중...";
			invoke("gen_commit_msg", { srv: srv, kind: svn.kind, paths: items.map(function (it) { return it.path; }) }).then(function (r) {
				reset();
				if (srv !== svn.srv) return;
				$("svnMsg").value = r.msg;
				svn.msgProblems = r.problems;
				msgWarn();
				$("svnMsg").focus();
			}).catch(function (e) { reset(); showError(String(e)); });
		};
		// 사람이 적어 둔 메시지를 말없이 덮지 않는다
		if ($("svnMsg").value.trim()) {
			vcsConfirm({ title: "Commit message 다시 만들기", html: "지금 적힌 메시지를 새로 만든 것으로 바꿉니다.", ok: "바꾸기", run: go });
		} else go();
	};

	/* --- Git Fetch · Push (Allow write 를 켠 Git 서버) --- */

	// 원격 추적 브랜치만 고치고 작업 파일은 그대로라 확인 창 없이 돈다
	$("svnDoFetch").onclick = function () {
		vcsRun("Fetch 하는 중...", "vcs_fetch", { srv: svn.srv }, function (m) { showToast(m); svnActivate(true); });
	};
	// 바깥 저장소에 남아 되돌리기 어렵다 — 올라갈 커밋을 늘 확인 창에 보이고, 초점은 「취소」에 둔다 (danger)
	$("svnDoPush").onclick = function () {
		if (svn.busy) return;
		var srv = svn.srv;
		invoke("git_outgoing", { srv: srv }).then(function (o) {
			if (!o.upstream) { showError((o.branch || "분리된 HEAD") + " 에 원격 추적 브랜치가 없습니다. 처음 올리는 브랜치는 git push -u 로 직접 올리세요."); return; }
			if (!o.entries.length) { showToast("올릴 커밋이 없습니다 · " + o.upstream); return; }
			vcsConfirm({
				title: state.servers[srv].name + " · Push " + o.entries.length + "개",
				html: "<b>" + esc(o.branch) + " → " + esc(o.upstream) + "</b>\n" +
					'<span class="flag">원격 저장소에 올라가면 실행기에서 되돌릴 수 없습니다.</span> 올릴 커밋을 한 번 더 보세요.',
				items: o.entries.map(function (e) { return [e.short + "  " + (e.msg || "").split("\n")[0], e.author]; }),
				ok: "Push",
				danger: true,
				run: function () {
					vcsRun("Push 하는 중...", "vcs_push", { srv: srv }, function (m) { showToast(m); svnActivate(true); });
				}
			});
		}).catch(function (e) { showError(String(e)); });
	};

	/* --- 쓰기 (Allow write 를 켠 서버 · 늘 확인 창을 거친다) --- */

	// o : { title, html(설명 · 이미 esc 한 것), items([[경로, 상태]]), ok(단추 이름), danger, run }
	function vcsConfirm(o) {
		closeMenu();
		$("vcsDlgTitle").textContent = o.title;
		$("vcsDlgText").innerHTML = o.html || "";
		var items = o.items || [];
		$("vcsDlgList").innerHTML = items.map(function (x) { return "<li><span>" + esc(x[0]) + "</span><span>" + esc(x[1] || "") + "</span></li>"; }).join("");
		$("vcsDlgList").hidden = !items.length;
		var ok = $("vcsDlgOk");
		ok.textContent = o.ok;
		ok.className = "btn " + (o.danger ? "danger" : "primary");
		ok.onclick = function () { vcsHide(); o.run(); };
		$("vcsScrim").hidden = false;
		// 되돌릴 수 없는 일이면 초점을 「취소」에 둔다 — Enter 한 번에 지워지지 않게
		(o.danger ? $("vcsDlgCancel") : ok).focus();
	}
	function vcsHide() { $("vcsScrim").hidden = true; }
	$("vcsDlgCancel").onclick = vcsHide;
	$("vcsScrim").onclick = function (e) { if (e.target === this) vcsHide(); };
	$("vcsScrim").addEventListener("keydown", function (e) {
		if (e.key === "Escape") { vcsHide(); e.stopPropagation(); }
		if (e.key === "Tab") {   // 확인 창 밖으로 초점이 새지 않게 두 단추 사이만 돈다
			e.preventDefault();
			(document.activeElement === $("vcsDlgOk") ? $("vcsDlgCancel") : $("vcsDlgOk")).focus();
		}
	});

	// 쓰기 하나를 돌린다. 도는 동안 단추를 잠그고, 계정이 필요하면 로그인 칸을 띄운 뒤 같은 일을 다시 한다.
	// 끝나면 실행기가 vcs-dirty 를 보내 Changes 를 다시 읽는다.
	function vcsRun(busyText, cmd, args, done) {
		if (svn.busy) return;
		var setBusy = function (on) {
			svn.busy = on;
			$("svnCommit").classList.toggle("busy", on);
			$("svnUpdateBar").classList.toggle("busy", on);
			$("svnDiff").classList.toggle("busy", on);
		};
		setBusy(true);
		$("svnInfo").textContent = busyText;
		invoke(cmd, args).then(function (r) {
			setBusy(false);
			done(r);
		}).catch(function (e) {
			setBusy(false);
			if (!remoteErr(e, function () { vcsRun(busyText, cmd, args, done); })) showError(String(e));
		});
	}
	function vcsArgs(more) {
		var a = { srv: svn.srv, kind: svn.kind };
		Object.keys(more || {}).forEach(function (k) { a[k] = more[k]; });
		return a;
	}
	function vcsTarget() {
		var st = svn.data[K()];
		return isGit() ? (st && st.branch ? "브랜치 " + esc(st.branch) : "지금 브랜치") : (st ? esc(st.url) : "저장소");
	}
	function vcsCommitAsk() {
		var items = svnChecked();
		if (!items.length) { showError("고른 파일이 없습니다."); return; }
		var msg = $("svnMsg").value.trim();
		if (!msg) { showError("Commit message 를 먼저 적으세요."); $("svnMsg").focus(); return; }
		var conf = items.filter(function (it) { return it.conflict; });
		if (conf.length) { showError("Conflicted 파일은 Resolve 한 뒤 Commit 합니다: " + conf.map(function (it) { return it.path; }).join(", ")); return; }
		var adds = items.filter(function (it) { return it.code === "?"; }).length;
		// 규칙에 어긋나면 같은 확인 창에 까닭을 붙이고 단추를 「그래도 Commit」으로 — 그 단추로만 실행기가 넘겨 준다
		msgCheck(function (broken) {
			vcsConfirm({
				title: state.servers[svn.srv].name + " · Commit " + items.length + "개",
				html: "<b>" + esc(msg) + "</b>\n" +
					(broken.length ? '<span class="flag">메시지가 규칙에 맞지 않습니다: ' + esc(broken.join(" · ")) + "</span>\n" : "") +
					vcsTarget() + " 에 올립니다. 올릴 파일을 한 번 더 보세요." +
					(adds ? "\n" + (isGit() ? "Untracked" : "Unversioned") + " " + adds + "개는 먼저 더한 뒤 올립니다." : ""),
				items: items.map(function (it) { return [it.path + (it.dir ? "/" : ""), it.label]; }),
				ok: broken.length ? "그래도 Commit" : "Commit",
				run: function () {
					vcsRun("Commit 하는 중...", "vcs_commit", vcsArgs({ paths: items.map(function (it) { return it.path; }), msg: msg, allowRuleBreak: broken.length > 0 }), function (m) {
						$("svnMsg").value = "";
						svn.msgProblems = [];
						msgWarn();
						showToast(m);
					});
				}
			});
		});
	}
	// list 를 주면 그 줄만 (우클릭), 없으면 고른 파일
	function vcsRevertAsk(list) {
		var items = (list || svnChecked()).filter(function (it) { return it.code !== "?"; });
		if (!items.length) { showError("Revert 할 것이 없습니다. " + (isGit() ? "Untracked" : "Unversioned") + " 파일은 되돌릴 것이 없습니다."); return; }
		vcsConfirm({
			title: state.servers[svn.srv].name + " · Revert " + items.length + "개",
			html: '<span class="flag">Revert 하면 고친 내용이 사라지고 되살릴 수 없습니다.</span>\n' +
				(isGit() ? "HEAD 내용으로 되돌립니다. Added 파일은 색인에서만 빠지고 파일은 남습니다." : "BASE 내용으로 되돌립니다. Added 파일은 Unversioned 로 돌아가고 파일은 남습니다."),
			items: items.map(function (it) { return [it.path + (it.dir ? "/" : ""), it.label]; }),
			ok: "Revert",
			danger: true,
			run: function () {
				vcsRun("Revert 하는 중...", "vcs_revert", vcsArgs({ paths: items.map(function (it) { return it.path; }) }), showToast);
			}
		});
	}
	function vcsUpdateAsk() {
		var git = isGit(), name = git ? "Pull" : "Update";
		var inc = (svn.remote[K()] || {}).incoming;
		var over = inc ? inc.overlap : [];
		vcsConfirm({
			title: state.servers[svn.srv].name + " · " + name,
			html: (inc ? (inc.entries.length ? "들어올 커밋 " + inc.entries.length + (inc.more ? "개 넘음" : "개") + "." : "Incoming 으로는 받을 것이 없습니다.") + " " : "") +
				(git ? "명령: " + esc(updateCmd()) + " · 갈라졌으면 합치지 않고 멈춥니다." : "svn update · 작업복사본 전체를 저장소 최신으로 받습니다.") +
				(over.length ? '\n<span class="flag">아래 파일은 내가 고친 파일과 겹쳐 합쳐지거나 Conflicted 가 됩니다.</span>' : ""),
			items: over.map(function (p) { return [p, "내가 고친 파일"]; }),
			ok: name,
			run: function () {
				vcsRun(name + " 하는 중...", "vcs_update", vcsArgs(), function (d) {
					showToast(d.msg + (d.conflicts.length ? " · Conflicted " + d.conflicts.length + "건 · Changes 에서 Resolve 하세요" : ""));
					if (d.conflicts.length) { svn.view = "local"; svn.sel = null; svnRenderSrv(); }
					svnActivate(true);
				});
			}
		});
	}
	function vcsResolve(path, accept) {
		var r = RESOLVE[accept];
		vcsConfirm({
			title: "Resolve · " + r[0],
			html: esc(r[1]),
			items: [[path, "Conflicted"]],
			ok: r[0],
			danger: accept !== "working",
			run: function () { vcsRun("Resolve 하는 중...", "vcs_resolve", vcsArgs({ path: path, accept: accept }), showToast); }
		});
	}
	// Log 의 커밋 하나를 거꾸로 적용 — 결과는 Changes 에 남고 Commit 은 따로 한다
	function vcsUndoAsk(e) {
		var git = isGit(), name = git ? e.short : "r" + e.rev;
		var ACT = { A: "Added", M: "Modified", D: "Deleted", R: "Replaced" };
		vcsConfirm({
			title: name + " 의 변경 되돌리기",
			html: "<b>" + esc((e.msg || "(메시지 없음)").split("\n")[0]) + "</b> · " + esc(e.author) + "\n" +
				"이 " + (git ? "커밋" : "리비전") + "의 변경을 거꾸로 작업복사본에 적용합니다. 결과는 Changes 에 남고, Commit 은 확인한 뒤 따로 합니다." +
				(git ? "" : " 작업복사본 밖 경로의 변경은 되돌아가지 않습니다."),
			items: e.paths.filter(function (c) { return c.inside; }).map(function (c) { return [c.path + (c.dir ? "/" : ""), ACT[c.action] || c.action]; }),
			ok: git ? "Revert commit" : "Revert changes",
			run: function () {
				vcsRun("되돌리는 중...", "vcs_revert_revision", vcsArgs({ rev: git ? e.id : String(e.rev) }), function (d) {
					showToast(d.msg + (d.conflicts.length ? " · Conflicted " + d.conflicts.length + "건" : ""));
					svn.view = "local"; svn.sel = null;
					svnRenderSrv(); svnActivate(true);
				});
			}
		});
	}
	$("svnDoCommit").onclick = vcsCommitAsk;
	$("svnRevert").onclick = function () { vcsRevertAsk(null); };
	$("svnDoUpdate").onclick = vcsUpdateAsk;

	listen("vcs-dirty", function (e) {
		var srv = e.payload;
		["svn", "git"].forEach(function (k) {
			var key = srv + ":" + k;
			svn.stale[key] = true;
			// Commit · Update · fetch 로 바뀌면 Incoming 결과도 낡는다 — 다음에 그 보기를 열 때 다시 본다
			if (svn.remote[key]) svn.remote[key].incoming = null;
		});
		if (tab === "svn" && srv === svn.srv && svn.view === "local" && kindsOf(srv).length) {
			clearTimeout(svn.timer);
			svn.timer = setTimeout(svnLoad, 1200);
		}
	});

	/* ---------- 설정 › 서버 · 경로 (저장하면 다음 기동부터) ---------- */

	// [키, 라벨, 설명, 입력 꼴]
	var SRV_FIELDS = [
		["name", "이름", "서버 줄 · 탭에 보이는 이름입니다.", "text"],
		["project", "프로젝트 폴더", "src/main/webapp 이 있는 폴더입니다. 「고르기」로 저장소 맨 위를 골라도 바로 아래 한 단계에서 찾습니다. 소스는 읽기만 합니다. 바꾸면 저장 감시가 바로 새 폴더로 옮겨 갑니다.", "dir"],
		["httpPort", "HTTP 포트", "브라우저로 들어오는 포트입니다.", "number"],

		["shutdownPort", "종료 포트", "톰캣을 정상 종료할 때 씁니다.", "number"],
		["debugPort", "디버거 포트", "「디버거 연결 허용」을 켜면 IDE 가 이 포트로 붙습니다.", "number"],
		// 2026.10.29 : 자바 컴파일 옵션 — 「시작하기」가 이클립스 프로젝트 설정(.settings)으로 채운다. 켜진 서버에서는 잠근다 (srvFill)
		["encoding", "소스 인코딩", "자바 소스를 읽는 인코딩입니다 (javac -encoding). 비우면 UTF-8. 이클립스 프로젝트 속성 › Resource › Text file encoding 과 같게 둡니다. 다르면 소스의 한글 문자열이 깨집니다. 톰캣을 끈 뒤에 바꿀 수 있고, 바꾸면 다음 컴파일 때 전체를 다시 만듭니다.", "encoding"],
		["parameters", "매개변수 이름", "메서드 매개변수 이름을 클래스에 남깁니다 (javac -parameters). 이클립스 「Store information about method parameters」와 같습니다. @Param 없이 쓴 MyBatis 매퍼가 이름으로 찾으려면 켭니다. 톰캣을 끈 뒤에 바꿀 수 있고, 바꾸면 다음 컴파일 때 전체를 다시 만듭니다.", "check"],
		// 2026.10.29 : server.xml 에 박혀 있던 두 값 — 「시작하기」가 이클립스 서버의 값으로 채운다
		["contextPath", "접속 경로", "앱을 여는 경로입니다 (예: /shop). 비우면 / 입니다. 이클립스에서 /프로젝트명 으로 열던 앱은 같게 적어야 절대경로 링크 · 리다이렉트가 맞습니다. 다음 기동부터.", "text"],
		["maxParameterCount", "파라미터 수 상한", "요청 하나에 받는 파라미터 수입니다 (톰캣 maxParameterCount). 넘으면 나머지가 잘립니다. 기본 10000 은 톰캣 8.5 기본이자 이클립스 서버에 값이 없을 때와 같습니다. -1 은 무제한. 다음 기동부터.", "count"],

		["java", "java (핫리로드 끔)", "핫리로드를 끄고 띄울 때 이 서버가 쓰는 java.exe 입니다. 「시작하기」가 이클립스 서버가 쓰던 JRE 로 채웁니다. 비우면 설정 › 경로의 java 를 씁니다. 핫리로드를 켜면 DCEVM 8u181 로 뜹니다.", "java"],
		["jvmArgs", "JVM 인자", "이 서버에만 더할 인자입니다. 한 줄에 하나. 회사 · 팀 전용 시스템 속성(-D…)은 여기 둡니다.", "lines"]
	];
	function srvField(f) {
		var span = '<span title="' + esc(f[2]) + '">' + f[1] + "</span>";
		// 바로가기 · 프로젝트 폴더는 칸 안에 단추가 있어 label 로 감싸지 않는다 (label 은 첫 입력 칸 하나만 가리킨다)
		if (f[3] === "links") {
			return '<div class="field top">' + span + '<div><div class="links"></div>' +
				'<button class="btn sm" data-k="linkAdd">바로가기 추가</button></div></div>';
		}
		if (f[3] === "dir") {
			return '<div class="field">' + span + '<div class="pick"><input type="text" data-k="' + f[0] + '" spellcheck="false" title="' + esc(f[2]) + '">' +
				'<button class="btn sm" data-k="pick" title="Windows 폴더 고르기 창을 엽니다">고르기</button></div></div>';
		}
		// java 칸은 아래에 지금 뜰 판과 이클립스가 쓰던 판을 흐리게 보인다 (srvFill)
		if (f[3] === "java") {
			return '<div class="field top">' + span + '<div><input type="text" data-k="' + f[0] + '" spellcheck="false" title="' + esc(f[2]) + '">' +
				'<small class="svn-note" data-k="javaHint"></small></div></div>';
		}
		if (f[3] === "encoding") {
			return '<label class="field">' + span + '<input type="text" data-k="' + f[0] + '" list="encList" placeholder="UTF-8" spellcheck="false" title="' + esc(f[2]) + '"></label>';
		}
		if (f[3] === "check") {
			return '<div class="field">' + span + '<label class="chk" title="' + esc(f[2]) + '"><input type="checkbox" data-k="' + f[0] + '">남긴다 (-parameters)</label></div>';
		}
		var input = f[3] === "lines"
			? '<textarea data-k="' + f[0] + '" spellcheck="false" title="' + esc(f[2]) + '"></textarea>'
			: '<input type="' + (f[3] === "count" ? "number" : f[3]) + '" data-k="' + f[0] + '" spellcheck="false" title="' + esc(f[2]) + '"' + (f[3] === "number" ? ' min="1" max="65535"' : f[3] === "count" ? ' min="-1"' : "") + ">";
		return '<label class="field' + (f[3] === "lines" ? " top" : "") + '">' + span + input + "</label>";
	}
	// 「/」로 시작하는 바로가기 주소는 그 서버의 HTTP 포트 · 접속 경로로 — 포트나 경로를 바꿔도 단추를 고치지 않아도 된다.
	// 이미 접속 경로까지 적은 주소(/shop/main.do)에는 다시 붙이지 않는다
	function linkUrl(sv, url) {
		if (url.charAt(0) !== "/") return url;
		var ctx = sv.contextPath || "";
		var has = ctx && (url === ctx || url.indexOf(ctx + "/") === 0 || url.indexOf(ctx + "?") === 0);
		return "http://localhost:" + sv.httpPort + (has ? "" : ctx) + url;
	}
	function linkRow(l) {
		return '<div class="link-row">' +
			'<input type="text" data-l="label" spellcheck="false" placeholder="이름" value="' + esc(l.label === l.url ? "" : l.label) + '">' +
			'<input type="text" data-l="url" spellcheck="false" placeholder="/경로 또는 http://주소" value="' + esc(l.url) + '">' +
			'<button class="btn ghost sm" data-l="del" title="이 바로가기를 뺍니다">빼기</button></div>';
	}
	function srvLinksRead(box) {
		return [].map.call(box.querySelectorAll(".link-row"), function (r) {
			var url = r.querySelector('[data-l="url"]').value.trim(), label = r.querySelector('[data-l="label"]').value.trim();
			return url ? { label: label || url, url: url } : null;
		}).filter(Boolean);
	}
	// 서버 줄 「바로가기」 메뉴가 비어 있을 때 → 설정의 그 서버 칸을 보여 주고 잠깐 테두리를 띄운다
	function openSrvForm(i) {
		openSettings("setServers");
		var box = $("srv" + i);
		box.scrollIntoView({ block: "center" });
		box.classList.add("flash");
		setTimeout(function () { box.classList.remove("flash"); }, 1200);
		box.querySelector('[data-k="linkAdd"]').focus();
	}
	function srvBuild(s) {
		$("srvForms").innerHTML = s.servers.map(function (sv, i) {
			return '<div class="vcs-srv" id="srv' + i + '"><div class="checks-sub">' + esc(sv.name) + "</div>" +
				SRV_FIELDS.map(srvField).join("") +
				'<div class="vcs-acts"><button class="btn" data-k="save">저장</button></div></div>';
		}).join("") + '<datalist id="encList"><option value="UTF-8"><option value="MS949"><option value="EUC-KR"></datalist>';
		s.servers.forEach(function (sv, i) {
			var box = $("srv" + i);
			var val = function (k) { return box.querySelector('[data-k="' + k + '"]').value; };
			box.querySelector('[data-k="save"]').onclick = function () {
				var edit = {
					name: val("name"), project: val("project"),
					httpPort: +val("httpPort"), ajpPort: +val("ajpPort"), shutdownPort: +val("shutdownPort"), debugPort: +val("debugPort"),
					contextPath: val("contextPath"),
					maxParameterCount: val("maxParameterCount").trim() === "" ? 10000 : +val("maxParameterCount"),
					links: srvLinksRead(box),
					jvmArgs: val("jvmArgs").split(/\r?\n/),
					java: val("java"),
					encoding: val("encoding"),
					parameters: box.querySelector('[data-k="parameters"]').checked
				};
				invoke("set_server", { srv: i, edit: edit }).then(function (moved) {
					box._dirty = false;
					showToast("저장했습니다 · " + edit.name + (moved ? " · 새 폴더를 감시합니다" : " · 다음 기동부터"));
				}).catch(function (e) { showError(String(e)); });
			};
			box.oninput = function () { box._dirty = true; };
			box.querySelector('[data-k="linkAdd"]').onclick = function () {
				var list = box.querySelector(".links");
				list.insertAdjacentHTML("beforeend", linkRow({ label: "", url: "" }));
				list.lastChild.querySelector('[data-l="label"]').focus();
				box._dirty = true;
			};
			box.querySelector(".links").onclick = function (ev) {
				var del = ev.target.closest('[data-l="del"]');
				if (!del) return;
				del.closest(".link-row").remove();
				box._dirty = true;
			};
			// 고른 폴더는 칸에만 넣는다 — 저장은 「저장」 단추로
			box.querySelector('[data-k="pick"]').onclick = function () {
				var btn = this, input = box.querySelector('[data-k="project"]');
				var put = function (dir) { input.value = dir; box._dirty = true; hideError(); };
				invoke("pick_project", { start: input.value }).then(function (found) {
					if (found.length === 1) put(found[0]);
					else if (found.length > 1) openMenu(btn, found.map(function (d) { return { label: baseName(d), sub: d, run: function () { put(d); } }; }));
				}).catch(function (e) { showError(String(e)); });
			};
		});
		$("srvAdd").onclick = function () {
			invoke("add_server").then(function () { showToast("서버를 더했습니다 · 설정 › 서버에서 프로젝트 폴더를 정하세요"); })
				.catch(function (e) { showError(String(e)); });
		};
		var PATH_FIELDS = [
			["tomcatHome", "톰캣 폴더", "톰캣 8.5 를 설치한 폴더입니다 (bin/bootstrap.jar 가 있는 곳).", "text"],
			["javac", "javac", "자바 컴파일러입니다. 같은 JDK 의 lib/tools.jar 도 씁니다. 기본은 함께 설치된 JDK 8 입니다.", "text"],
			["javaPlain", "java (핫리로드 끔)", "핫리로드를 끄고 띄울 때 쓰는 기본 java 입니다. 설정 › 서버의 java 칸을 비운 서버만 이것을 씁니다.", "text"],
			["editor", "편집기", "컴파일 오류를 누르면 「편집기 -g 파일:줄」 로 엽니다. 비우면 탐색기로 엽니다.", "text"],
			// 2026.10.29 : 비워 두면 「자동 생성」이 숨는다. 채우면 누를 때마다 고른 파일의 Diff 가 이 명령(그 뒤의 서비스)으로 나간다
			["msgCmd", "Commit message 생성 명령", "버전 관리 탭의 「자동 생성」이 부르는 언어 모델 CLI 입니다 (예: claude -p). 고른 파일의 Diff 와 그 서버의 메시지 규칙을 stdin 으로 넘기고 답의 첫 줄을 씁니다. 소스가 그 CLI 의 서비스로 나갑니다. 비우면 자동 생성을 쓰지 않습니다.", "text"],
			["tldScan", "TLD jar", "태그 라이브러리를 찾을 jar 이름 (쉼표로 · * 가능). 비우면 모든 jar 를 봅니다. 좁히면 기동이 빨라집니다.", "text"]
		];
		var pf = $("pathForm");
		pf.innerHTML = PATH_FIELDS.map(srvField).join("") + '<div class="vcs-acts"><button class="btn" data-k="save">저장</button></div>';
		pf.querySelector('[data-k="save"]').onclick = function () {
			var paths = {};
			PATH_FIELDS.forEach(function (f) { paths[f[0]] = pf.querySelector('[data-k="' + f[0] + '"]').value; });
			invoke("set_paths", { paths: paths }).then(function () {
				pf._dirty = false;
				showToast("저장했습니다 · 경로");
			}).catch(function (e) { showError(String(e)); });
		};
		pf.oninput = function () { pf._dirty = true; };
	}
	function srvFill(s) {
		s.servers.forEach(function (sv, i) {
			var box = $("srv" + i);
			if (!box) return;
			// 켜진 서버는 컴파일 옵션을 잠근다 — 고치던 중에 서버가 켜져도 잠기도록 _dirty 보다 먼저 본다 (저장해도 set_server 가 막는다)
			var lock = sv.status !== "stopped";
			["encoding", "parameters"].forEach(function (k) {
				var el = box.querySelector('[data-k="' + k + '"]');
				el.disabled = lock;
				el.closest(".field").title = lock ? "톰캣을 끈 뒤에 바꿀 수 있습니다" : "";
			});
			if (box._dirty) return;
			var set = function (k, v) { box.querySelector('[data-k="' + k + '"]').value = v; };
			set("encoding", sv.encoding);
			box.querySelector('[data-k="parameters"]').checked = sv.parameters;
			set("name", sv.name); set("project", sv.project);
			set("httpPort", sv.httpPort); set("ajpPort", sv.ajpPort); set("shutdownPort", sv.shutdownPort); set("debugPort", sv.debugPort);
			set("contextPath", sv.contextPath); set("maxParameterCount", sv.maxParameterCount);
			box.querySelector(".links").innerHTML = sv.links.map(linkRow).join("");
			set("jvmArgs", sv.jvmArgs.join("\n"));
			set("java", sv.java);
			box.querySelector('[data-k="javaHint"]').textContent = (sv.java ? "" : "비어 있어 설정 › 경로의 java · ") + "자바 " + sv.javaLabel +
				(sv.eclipseJava ? " · 이클립스 자바 " + sv.eclipseJavaLabel + (sv.eclipseJava.toLowerCase() === sv.java.toLowerCase() ? " (같음)" : " · " + sv.eclipseJava) : "");
		});
		var pf = $("pathForm");
		if (pf && !pf._dirty) {
			Object.keys(s.paths).forEach(function (k) {
				var el = pf.querySelector('[data-k="' + k + '"]');
				if (el) el.value = s.paths[k];
			});
		}
	}

	/* ---------- 설정 › 버전 관리 (서버마다 · 저장하면 바로 적용) ---------- */

	// [키, 라벨, 설명(라벨의 title), 이 칸이 쓰이는 종류]
	// 2026-10-28 : 설명은 화면에서 걷어 title 로. SVN · Git 전용 칸은 그 종류일 때만 보인다 (숨겨도 저장 값에는 그대로 들어간다)
	var VCS_FIELDS = [
		["root", "작업 폴더", "비우면 프로젝트 폴더를 봅니다.", ""],
		["commitHint", "Commit message 예시", "Commit message 칸에 흐리게 보입니다. 팀의 메시지 규칙을 적어 둡니다. 「자동 생성」의 본보기로도 넘깁니다.", ""],
		// 2026.10.29 : 메시지 규칙 — 빈 칸은 보지 않는다. 어겨도 막지 않고 Commit · 복사 때 확인 창에서 한 번 더 묻는다
		["msgRule", "메시지 규칙", "「자동 생성」 때 모델에게 주는 팀 규칙입니다 (예: 이슈 키 뒤에 한 줄 평서문 「~한다」).", ""],
		["issuePattern", "이슈 번호 찾기", "브랜치 이름(SVN 은 저장소 경로)에서 이슈 번호를 찾는 정규식입니다. 찾은 번호를 「자동 생성」에 넘깁니다. 기본 [A-Z][A-Z0-9]+-\\d+ (FDR-112 꼴).", ""],
		["subjectPattern", "제목 규칙", "제목(첫 줄)이 맞아야 하는 정규식입니다. 예: ^[A-Z]+-\\d+ .+다$ . 비우면 보지 않습니다.", ""],
		["subjectMax", "제목 최대 길이", "제목 글자 수 상한입니다 (한글도 한 글자). 비우거나 0 이면 보지 않습니다.", ""],
		["svnUpdate", "Update 명령", "Allow write 를 끈 서버에서 「Update 명령 복사」가 만드는 SVN 명령입니다. 앞에 cd 줄이 붙습니다.", "svn"],
		["gitUpdate", "Pull 명령", "「Pull」 단추와 「Pull 명령 복사」가 쓰는 git 명령입니다. 복사할 때는 앞에 cd 줄이 붙습니다.", "git"],
		["svnExe", "svn.exe", "비우면 PATH → TortoiseSVN · SlikSVN 설치 폴더 → 「svn 받기」로 받은 svn 순서로 찾습니다. SVN 의 Allow write 와 Blame 에 씁니다 (1.10 이상).", "svn"]
	];
	// 2026-10-29 : 저장소에 쓰는 것은 서버마다 켠다 — 기본은 꺼짐 (명령 복사만)
	var WRITE_TIP = "켜면 이 서버의 버전 관리 탭에서 Commit · Update(Pull) · Revert · Resolve 를, Git 이면 Fetch · Push 도 실행합니다. Fetch 밖에는 실행 전에 늘 확인 창이 뜹니다. 끄면 명령을 복사만 해 줍니다.";
	function vcsBuild(s) {
		$("vcsForms").innerHTML = s.servers.map(function (sv, i) {
			return '<div class="vcs-srv" id="vcs' + i + '"><div class="checks-sub">' + esc(sv.name) + '<span data-k="found"></span></div>' +
				'<label class="field"><span title="자동 감지는 작업 폴더의 .svn · .git 을 보고 정합니다.">종류</span>' +
				'<select data-k="kind"><option value="auto">자동 감지</option><option value="svn">SVN</option><option value="git">Git</option>' +
				'<option value="both">SVN 과 Git</option><option value="none">쓰지 않음</option></select></label>' +
				'<label class="field" data-for="any"><span title="' + esc(WRITE_TIP) + '">Allow write</span>' +
				'<span class="chk" title="' + esc(WRITE_TIP) + '"><input type="checkbox" data-k="write">Commit · Update · Revert 를 이 창에서 실행</span></label>' +
				VCS_FIELDS.map(function (f) {
					return '<label class="field" data-for="' + f[3] + '"><span title="' + esc(f[2]) + '">' + f[1] + '</span><input type="text" data-k="' + f[0] + '" spellcheck="false" title="' + esc(f[2]) + '"></label>';
				}).join("") +
				'<div class="field top" data-for="svn"><span>찾은 svn</span><div><small class="svn-note" data-k="svnCli"></small>' +
					'<div class="svn-get" data-k="svnGetBox" hidden><button class="btn sm" data-k="svnGet"></button><small class="svn-note" data-k="svnGetNote"></small></div></div></div>' +
				'<div class="vcs-acts"><button class="btn" data-k="save">저장</button></div></div>';
		}).join("");
		s.servers.forEach(function (sv, i) {
			var box = $("vcs" + i);
			box.querySelector('[data-k="svnGet"]').onclick = function () {
				invoke("svn_get").catch(function (e) { showError(String(e)); });
			};
			box.querySelector('[data-k="save"]').onclick = function () {
				var v = { kind: box.querySelector('[data-k="kind"]').value, write: box.querySelector('[data-k="write"]').checked };
				VCS_FIELDS.forEach(function (f) { v[f[0]] = box.querySelector('[data-k="' + f[0] + '"]').value; });
				// 실행기는 숫자를 받는다 — 비우면 0 (보지 않음)
				v.subjectMax = Math.max(0, parseInt(v.subjectMax, 10) || 0);
				invoke("set_vcs", { srv: i, vcs: v }).then(function () {
					box._dirty = false;
					showToast("저장했습니다 · " + state.servers[i].name + " 버전 관리");
				}).catch(function (e) { showError(String(e)); });
			};
			// 고치는 중에는 상태가 와도 칸을 덮어쓰지 않는다
			box.oninput = box.onchange = function () { box._dirty = true; vcsShow(box, state.servers[i]); };
		});
	}
	// 고른 종류에 쓰이는 칸만 보인다. 자동 감지면 지금 찾은 것을, 아무것도 못 찾았으면 둘 다 보인다 (나중에 생길 저장소를 미리 적어 둘 수 있게)
	function vcsShow(box, sv) {
		var kind = box.querySelector('[data-k="kind"]').value;
		var kinds = kind === "auto" ? (sv.vcsKinds.length ? sv.vcsKinds : ["svn", "git"])
			: kind === "both" ? ["svn", "git"] : kind === "none" ? [] : [kind];
		[].forEach.call(box.querySelectorAll("[data-for]"), function (el) {
			var f = el.getAttribute("data-for");
			el.hidden = kind === "none" ? true : !!f && f !== "any" && kinds.indexOf(f) < 0;
		});
	}
	function vcsFill(s) {
		s.servers.forEach(function (sv, i) {
			var box = $("vcs" + i);
			if (!box) return;
			box.querySelector('[data-k="found"]').innerHTML = sv.vcsKinds.length
				? sv.vcsKinds.map(function (k) { return '<span class="k" title="지금 보는 것">' + esc(KIND_NAME[k]) + "</span>"; }).join("")
				: '<span class="k">없음</span>';
			var cli = box.querySelector('[data-k="svnCli"]');
			cli.textContent = sv.svnBlock ? sv.svnBlock : sv.svnCli;
			cli.classList.toggle("flag", !!sv.svnBlock);
			// 2026.10.29 : svn 받기 — 경로를 비웠는데 어디서도 못 찾았을 때만. 받는 중이거나 실패했으면 그것도 보인다 (모든 서버에 같은 상태)
			var g = s.svnGet, getting = g.downloading != null;
			box.querySelector('[data-k="svnGetBox"]').hidden = !(sv.svnMissing || getting);
			var gb = box.querySelector('[data-k="svnGet"]');
			gb.disabled = getting;
			gb.textContent = "svn 받기";
			gb.title = "VisualSVN 이 배포하는 Apache Subversion " + g.version + " 명령줄 도구(약 5 MB)를 받아 사용자 폴더(AppData\\Local\\tomcatrun\\svn)에 풉니다. 해시가 맞을 때만 씁니다.";
			var gn = box.querySelector('[data-k="svnGetNote"]');
			gn.textContent = getting ? "받는 중 · " + (g.downloading / 1048576).toFixed(1) + " MB" : g.error || "";
			gn.classList.toggle("flag", !getting && !!g.error);
			if (!box._dirty) {
				box.querySelector('[data-k="write"]').checked = !!sv.vcs.write;
				box.querySelector('[data-k="kind"]').value = sv.vcs.kind;
				VCS_FIELDS.forEach(function (f) { box.querySelector('[data-k="' + f[0] + '"]').value = sv.vcs[f[0]] || ""; });
				box.querySelector('[data-k="root"]').placeholder = sv.project;
			}
			vcsShow(box, sv);
		});
	}

/* ---------- 동작 ---------- */

	function showToast(msg) {
		$("toastText").textContent = msg;
		$("toast").classList.add("show");
		clearTimeout(showToast.t);
		// 긴 알림(자동으로 채운 결과 등)은 읽을 만큼 더 둔다
		showToast.t = setTimeout(function () { $("toast").classList.remove("show"); }, Math.max(2500, String(msg).length * 70));
	}
	function showError(msg) { errMsg = msg; renderAlerts(); renderSetErr(); }
	function hideError() { if (errMsg) { errMsg = ""; renderAlerts(); renderSetErr(); } }
	function call(cmd, args) {
		return invoke(cmd, args || {}).catch(function (e) { showError(String(e)); });
	}

	$("optHot").onchange = function () { call("set_option", { key: "hotReload", value: this.checked }); };
	$("optAuto").onchange = function () { call("set_option", { key: "autoCompile", value: this.checked }); };
	$("optDebug").onchange = function () { call("set_option", { key: "debug", value: this.checked }); };
	$("optFast").onchange = function () { call("set_option", { key: "fastJvm", value: this.checked }); };
	$("optPool").onchange = function () { call("set_option", { key: "smallPool", value: this.checked }); };
	$("optStagger").onchange = function () { call("set_option", { key: "staggerStart", value: this.checked }); };
	$("optSkipScan").onchange = function () { call("set_option", { key: "skipScan", value: this.checked }); };
	$("optProfile").onchange = function () { call("set_option", { key: "profileStart", value: this.checked }); };
	$("optSchedule").onchange = function () { call("set_option", { key: "noSchedule", value: this.checked }); };
	$("optLazy").onchange = function () { call("set_option", { key: "lazyInit", value: this.checked }); };
	$("optMapper").onchange = function () { call("set_option", { key: "mapperHotswap", value: this.checked }); };
	$("optSession").onchange = function () { call("set_option", { key: "keepSession", value: this.checked }); };
	$("optUpdate").onchange = function () { call("set_option", { key: "updateCheck", value: this.checked }); };
	$("updNow").onclick = function () { updDismissed = ""; call("update_check"); };
	$("updGo").onclick = function () { updateAsk(); };
	$("selHeap").onchange = function () { call("set_heap", { mb: parseInt(this.value, 10) }); };
	$("selCompiler").onchange = function () { call("set_compiler", { name: this.value }); };
	$("filter").oninput = redraw;
	$("onlyErr").onchange = redraw;
	$("btnClear").onclick = function () { if (store[tab]) { store[tab] = []; redraw(); } };
	$("logFolder").onclick = function () {
		var i = parseInt(tab.slice(3), 10);
		if (state && state.servers[i]) invoke("open", { target: state.servers[i].catalinaBase + "/logs" });
	};
	$("sbOpts").onclick = function (e) {
		var b = e.target.closest(".sb-item");
		if (b) openOpt(b.getAttribute("data-opt")); else openSettings();
	};
	$("sbOpts").title = "누르면 설정의 그 칸으로 갑니다";
	$("sbMem").onclick = function () { go("status"); };

/* ---------- 닫기 확인 ---------- */

	// 켜진 톰캣이 있을 때 닫으면 실행기가 「close-ask」로 묻는다. 확인하면 끄는 동안 서버별 상태를 보여 준다.
	var quitting = false;
	var STATUS_TEXT = { stopped: "꺼짐", starting: "켜는 중", running: "실행 중", stopping: "끄는 중" };
	function quitList(names) {
		$("quitList").innerHTML = names.map(function (n) {
			var sv = state && state.servers.filter(function (s) { return s.name === n; })[0];
			return "<li><span>" + esc(n) + "</span><span>" + (sv ? STATUS_TEXT[sv.status] || "" : "") + "</span></li>";
		}).join("");
	}
	function quitHide() { if (!quitting) { $("quitScrim").hidden = true; } }
	// 같은 창을 닫기 · 업데이트 두 곳에서 쓴다 — mode 가 "update" 면 확인 단추가 받기를 시작한다
	var quitMode = "close";
	function askQuit(names, mode) {
		closeMenu();
		quitMode = mode;
		var upd = mode === "update";
		$("quitScrim")._names = names;
		$("quitTitle").textContent = "톰캣이 실행 중입니다";
		$("quitText").textContent = upd
			? state.update.release.version + " 으로 업데이트하면 아래 서버를 끄고 설치한 뒤 실행기를 다시 엽니다. 받는 동안 켠 서버도 함께 꺼집니다."
			: "닫으면 함께 종료됩니다.";
		$("quitOk").textContent = upd ? "끄고 업데이트" : "종료하고 닫기";
		quitList(names);
		$("quitActs").hidden = false;
		$("quitScrim").hidden = false;
		$("quitOk").focus();
	}
	listen("close-ask", function (e) {
		if (quitting) return;
		askQuit(e.payload, "close");
	});
	// 2026.10.29 : 업데이트는 설치 직전에 켜진 톰캣을 묻지 않고 끈다 — 디버깅 중이던 서버가 예고 없이 내려가지 않게 누를 때 먼저 묻는다
	function updateAsk() {
		var on = state.servers.filter(function (s) { return s.status !== "stopped"; }).map(function (s) { return s.name; });
		if (!on.length) { hideError(); call("update_install"); return; }
		if (!$("quitScrim").hidden) return;
		askQuit(on, "update");
	}
	$("quitOk").onclick = function () {
		if (quitMode === "update") {
			$("quitScrim").hidden = true;
			hideError();
			call("update_install");
			return;
		}
		quitting = true;
		$("quitTitle").textContent = "톰캣을 끄는 중...";
		$("quitText").textContent = "모두 꺼지면 창이 닫힙니다. 정상 종료가 20초 안에 끝나지 않으면 강제로 끕니다.";
		$("quitActs").hidden = true;
		invoke("quit").catch(function (err) { quitting = false; quitHide(); showError(String(err)); });
	};
	$("quitCancel").onclick = quitHide;
	$("quitScrim").onclick = function (e) { if (e.target === this) quitHide(); };
	$("quitScrim").addEventListener("keydown", function (e) {
		if (e.key === "Escape") { quitHide(); e.stopPropagation(); }
		if (e.key === "Tab") {   // 확인 창 밖으로 초점이 새지 않게 두 단추 사이만 돈다
			e.preventDefault();
			(document.activeElement === $("quitOk") ? $("quitCancel") : $("quitOk")).focus();
		}
	});

	listen("state", function (e) {
		render(e.payload); renderMems();
		if (!$("quitScrim").hidden) quitList($("quitScrim")._names);
	});
	listen("mem", function (e) { memSnap = e.payload; renderMems(); renderMeta(); });
	listen("logs", function (e) { onLogs(e.payload); });
	listen("error", function (e) { showError(String(e.payload)); });
	listen("toast", function (e) { showToast(String(e.payload)); });
	// 켤 때 이클립스 설정을 찾지 못했다 — 폴더 하나만 고르면 되는 「시작하기」를 띄운다 (찾았으면 실행기가 알아서 가져온다)
	listen("setup-needed", function () { if (!setupAuto) { setupAuto = true; openSetup(); } });
	invoke("get_state").then(function (s) {
		render(s);
		if (early.length) { var x = early; early = []; onLogs(x); }
	});
	setInterval(renderMeta, 1000);
})();
</script>
</body>
