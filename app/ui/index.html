<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tomcatrun</title>
<style>
/* 2026-10-28 : 전체 리디자인. 왼쪽 옵션 기둥을 걷고 서버 줄 · 알림 줄 · 탭 · 상태 표시줄의 흔한 개발 도구 구조로 바꿨다.
   옵션은 「설정」 탭, 메모리 · 준비 상태 · 폴더는 「상태」 탭, 컴파일 단추는 「빌드」 탭으로 옮겼다.
   2026-10-28 : 색 · 글꼴 · 모양을 docket(_tools/docket/src/index.css)의 체계로 바꿨다.
   바탕은 무채색 회색 단계와 1px 선이고, 색은 뜻이 있을 때만 쓴다.
     --warn (호박)  사용자가 손댈 것 — 재시작 필요 · 의존 jar
     --crit (빨강)  실패 · 충돌 · 뺀 줄
     --ok   (초록)  서버 실행 중 · 점검 통과 · 더한 줄
   주요 단추는 색이 아니라 흑백 반전으로 띄운다. 파랑 강조는 없다.
   docket 은 「실행 중」도 무채색이지만, 여기서는 창을 열자마자 두 서버가 떠 있는지 보이도록 초록으로 남긴다.
   변수 이름은 그대로 두고 값만 docket 에서 가져왔다 — 아래 규칙들이 값을 따라 바뀐다. */
@font-face {
	/* docket 과 같은 Pretendard 를 ui/fonts 에 동봉한다 (exe 에 묻힌다 · CDN 을 쓰지 않는다).
	   파일이 없으면 시스템에 깔린 Pretendard, 그것도 없으면 --ui 의 다음 글꼴로 내려간다. */
	font-family: "Pretendard Variable";
	src: local("Pretendard Variable"), url("fonts/PretendardVariable.woff2") format("woff2-variations"), url("fonts/PretendardVariable.woff2") format("woff2");
	font-weight: 45 920; font-style: normal; font-display: block;
}
:root {
	--bg: oklch(0.975 0 0); --side: oklch(0.955 0 0); --panel: oklch(1 0 0); --panel-2: oklch(0.935 0 0);
	--line: oklch(0.885 0 0); --line-soft: oklch(0.95 0 0); --line-strong: oklch(0.78 0 0);
	--text: oklch(0.21 0 0); --muted: oklch(0.42 0 0); --faint: oklch(0.52 0 0);
	--brand: oklch(0.8 0.15 78); --brand-ink: oklch(0.24 0.04 70); --brand-text: oklch(0.5 0.12 62);
	--ok: oklch(0.5 0.13 150);
	--crit: oklch(0.54 0.2 27); --crit-solid: oklch(0.54 0.2 27);
	--ring: oklch(0.42 0 0 / 0.55); --sel: oklch(0.6 0 0 / 0.28);
	--shadow-pop: 0 10px 28px oklch(0 0 0 / 0.12), 0 1px 3px oklch(0 0 0 / 0.08);
	--close: oklch(0.58 0.21 25);    /* 제목 줄 닫기 hover — docket 창 단추와 같은 빨강 (두 테마 공통) */
	--ui: "Pretendard Variable", Pretendard, "Segoe UI", "Malgun Gothic", sans-serif;
	--mono: "Cascadia Code", "D2Coding", Consolas, "Malgun Gothic", monospace;
	color-scheme: light;
}
@media (prefers-color-scheme: dark) {
	:root {
		--bg: oklch(0.2 0 0); --side: oklch(0.215 0 0); --panel: oklch(0.235 0 0); --panel-2: oklch(0.275 0 0);
		--line: oklch(0.305 0 0); --line-soft: oklch(0.255 0 0); --line-strong: oklch(0.4 0 0);
		--text: oklch(0.93 0 0); --muted: oklch(0.77 0 0); --faint: oklch(0.65 0 0);
		--brand: oklch(0.82 0.14 80); --brand-ink: oklch(0.22 0.03 75); --brand-text: oklch(0.84 0.13 82);
		--ok: oklch(0.77 0.14 152);
		--crit: oklch(0.71 0.17 25); --crit-solid: oklch(0.56 0.2 27);   /* 꽉 찬 바탕은 흰 글자가 읽히도록 어둡게 */
		--ring: oklch(0.75 0 0 / 0.5); --sel: oklch(0.6 0 0 / 0.35);
		--shadow-pop: 0 14px 36px oklch(0 0 0 / 0.5), 0 1px 3px oklch(0 0 0 / 0.35);
		color-scheme: dark;
	}
}
:root {
	/* 옅은 바탕 · 선은 상태 색에서 만든다 (docket 의 bg-brand/12 · border-danger/25 꼴). 두 테마가 같은 식을 쓴다. */
	--warn: var(--brand-text); --on-warn: var(--brand-ink); --warn-solid: var(--brand);
	--warn-weak: color-mix(in oklch, var(--brand) 14%, transparent);
	--warn-line: color-mix(in oklch, var(--brand) 55%, transparent);
	--ok-weak: color-mix(in oklch, var(--ok) 12%, transparent);
	--crit-weak: color-mix(in oklch, var(--crit) 12%, transparent);
	--crit-line: color-mix(in oklch, var(--crit) 30%, transparent);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
	background: var(--bg); color: var(--text);
	font: 13px/1.55 var(--ui);
	-webkit-font-smoothing: antialiased;
	display: flex; flex-direction: column; overflow: hidden;
}
::selection { background: var(--sel); }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 999px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background-color: var(--faint); }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.ic { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- 단추 · 입력 ---------- */
.btn {
	display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px;
	font: 500 12.5px var(--ui); color: var(--text); background: var(--panel);
	border: 1px solid var(--line); border-radius: 6px; cursor: pointer; white-space: nowrap;
}
.btn:hover:not(:disabled) { background: var(--panel-2); }
.btn:active:not(:disabled) { background: var(--line-soft); }
.btn:disabled { opacity: .5; cursor: default; }
/* 주요 단추는 흑백 반전 — 색을 쓰면 「재시작 필요」 같은 상태 표시와 같은 말을 하게 된다 (docket) */
.btn.primary { background: var(--text); border-color: var(--text); color: var(--panel); }
.btn.primary:hover:not(:disabled) { background: var(--text); opacity: .85; }
.btn.warn { background: var(--warn-weak); border-color: var(--warn-line); color: var(--warn); font-weight: 600; }
.btn.warn:hover:not(:disabled) { background: color-mix(in oklch, var(--brand) 22%, transparent); }
.btn.danger { color: var(--crit); background: var(--crit-weak); border-color: var(--crit-line); }
.btn.danger:hover:not(:disabled) { background: color-mix(in oklch, var(--crit) 20%, transparent); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover:not(:disabled) { background: var(--panel-2); color: var(--text); }
.btn.sm { height: 24px; padding: 0 8px; font-size: 12px; }
.btn .ic { width: 14px; height: 14px; }
.btn .chev { width: 12px; height: 12px; margin: 0 -2px 0 -2px; }
input[type=text], input[type=password], input[type=search], select {
	height: 28px; font: 12.5px var(--ui); color: var(--text); background: var(--panel);
	border: 1px solid var(--line-strong); border-radius: 6px; padding: 0 8px;
}
input::placeholder { color: var(--faint); }
input[type=checkbox] { accent-color: var(--text); width: 14px; height: 14px; margin: 0; }
.chk { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; white-space: nowrap; font-size: 12.5px; }
.search { position: relative; display: inline-flex; }
.search .ic { position: absolute; left: 8px; top: 7px; color: var(--faint); }
.search input { padding-left: 28px; width: 200px; }
.seg { display: inline-flex; padding: 2px; gap: 2px; background: var(--line-soft); border: 1px solid var(--line); border-radius: 6px; }
.seg button {
	height: 22px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent;
	font: 500 12px var(--ui); color: var(--muted); cursor: pointer; white-space: nowrap;
}
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--panel); color: var(--text); font-weight: 600; box-shadow: inset 0 0 0 1px var(--line); }

/* ---------- 제목 줄 ----------
   2026-10-28 : Windows 기본 제목 줄을 끄고(tauri.conf.json decorations:false) 화면과 같은 판으로 그린다.
   끌기 · 두 번 눌러 최대화는 Tauri 의 data-tauri-drag-region, 가장자리 크기 조절은 Tauri 가 창 쪽에서 맡는다.
   지금 문제는 바로 아래 알림 줄에 있으므로 여기에는 이름만 둔다 (작업 표시줄 제목에는 그대로 붙는다). */
/* 2026-10-28 : docket 제목 줄에 맞춘다 — 36px · 한 단 낮은 판(--side) · 이름 12.5px 600 · 창 단추 44px. */
.titlebar { display: flex; align-items: stretch; flex: none; height: 36px; background: var(--side); border-bottom: 1px solid var(--line); user-select: none; }
.tb-drag { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding-left: 14px; }
.tb-icon { width: 16px; height: 16px; flex: none; }
.tb-title { font-size: 12.5px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-ver { margin-left: 6px; color: var(--faint); font-size: 11.5px; font-weight: 400; }
.tb-btn { width: 44px; flex: none; display: grid; place-items: center; border: 0; padding: 0; background: none; color: var(--muted); transition: background-color .12s, color .12s; }
.tb-btn svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1.1; stroke-linecap: round; }
.tb-btn:hover { background: var(--panel-2); color: var(--text); }
.tb-btn:active { background: var(--line); }
.tb-btn.close:hover, .tb-btn.close:active { background: var(--close); color: #fff; }
body.blur .tb-title, body.blur .tb-btn:not(:hover) { color: var(--faint); }
body.blur .tb-icon { opacity: .5; }

/* ---------- 서버 줄 ---------- */
.servers { display: grid; grid-template-columns: 1fr 1fr; background: var(--panel); border-bottom: 1px solid var(--line); }
.srv {
	display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center;
	padding: 10px 14px 10px 16px; min-width: 0;
}
.srv + .srv { border-left: 1px solid var(--line); }
.srv-head { display: flex; align-items: baseline; gap: 8px; min-width: 0; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex: none; align-self: center; }
.srv[data-st=running] .dot { background: var(--ok); }
/* 기동 · 중지 중은 무채색 점이 깜빡인다 (docket run-dot). 실행 중 초록은 docket 원칙의 예외다 — 맨 위 주석 참조. */
.srv[data-st=starting] .dot, .srv[data-st=stopping] .dot { background: var(--muted); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .srv .dot { animation: none !important; } }
.srv-name { font-size: 14px; font-weight: 600; }
.srv-port { color: var(--muted); font-size: 12px; }
.srv-state { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.srv[data-st=running] .srv-state { color: var(--ok); }
.srv[data-st=starting] .srv-state, .srv[data-st=stopping] .srv-state { color: var(--text); }
.srv-meta { grid-column: 1; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 17px; }
.srv-meta b { color: var(--text); font-weight: 600; }
.srv-meta .sep { color: var(--faint); margin: 0 6px; }
.srv-acts { grid-column: 2; grid-row: 1 / 3; display: flex; gap: 6px; }
@media (max-width: 1000px) {
	.servers { grid-template-columns: 1fr; }
	.srv + .srv { border-left: none; border-top: 1px solid var(--line); }
}

/* ---------- 알림 줄 (문제가 있을 때만) ---------- */
.alert {
	display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 0 10px; align-items: center;
	padding: 7px 14px 7px 16px; border-bottom: 1px solid var(--line);
}
.alert.warn { background: var(--warn-weak); color: var(--warn); }
.alert.crit { background: var(--crit-weak); color: var(--crit); }
.alert.ok { background: var(--ok-weak); color: var(--ok); }
.alert-text { min-width: 0; color: var(--text); }
.alert-text b { font-weight: 600; }
.alert-text .sub { color: var(--muted); margin-left: 8px; }
.alert-text a.src { margin-left: 8px; font-family: var(--mono); font-size: 12px; color: var(--text); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.alert-acts { display: flex; gap: 6px; }
.alert-items { grid-column: 2 / -1; margin: 6px 0 2px; padding: 0; list-style: none; max-height: 112px; overflow: auto; color: var(--text); }
.alert-items li { display: flex; align-items: center; gap: 0 8px; padding: 1px 0; font-size: 12px; }
.alert-items li .mono { overflow-wrap: anywhere; min-width: 0; }
.alert-items li .btn { margin-left: auto; height: 20px; flex: none; }
.alert-items .mono { font-size: 12px; }
.alert-items small { color: var(--muted); margin-left: 8px; }
.alert-items .keep { color: var(--ok); }
.alert-items .drop { color: var(--muted); text-decoration: line-through; }
.alert-items .fix { color: var(--warn); }

/* ---------- 탭 ---------- */
.tabs { display: flex; align-items: stretch; height: 38px; padding: 0 8px; background: var(--panel); border-bottom: 1px solid var(--line); }
.tabs .gap { flex: 1; }
.tab {
	display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; margin-bottom: -1px;
	border: 0; border-bottom: 2px solid transparent; background: none; cursor: pointer;
	font: 500 13px var(--ui); color: var(--muted); white-space: nowrap;
}
.tab:hover { color: var(--text); }
.tab.on { color: var(--text); font-weight: 600; border-bottom-color: var(--text); }
.tab .n { font: 600 11px var(--ui); min-width: 18px; height: 18px; line-height: 18px; padding: 0 5px; border-radius: 9px; text-align: center; background: var(--panel-2); color: var(--muted); }
.tab .n:empty { display: none; }
.tab .n.new { background: var(--text); color: var(--panel); }
.tab .n.bad { background: var(--crit-solid); color: #fff; }

/* ---------- 본문 ---------- */
main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.pane { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.toolbar {
	display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 44px; padding: 8px 14px;
	background: var(--panel); border-bottom: 1px solid var(--line);
}
.toolbar .end { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.bctl { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line-soft); }
.bctl b { width: 64px; font-weight: 600; }
.bres { color: var(--muted); font-size: 12px; margin-left: 6px; }
.bres.ok b { color: var(--ok); }
.bres.fail b { color: var(--crit); }

#log { flex: 1; overflow: auto; scrollbar-gutter: stable; background: var(--panel); padding: 4px 0 12px; }
#log.lines { font: 12px/1.55 var(--mono); white-space: pre-wrap; word-break: break-all; background: var(--bg); }
#log.lines > div { padding: 0 14px; }
#log.lines .err { color: var(--crit); background: var(--crit-weak); }
#log.lines .warn { color: var(--warn); }
#log.lines .ok { color: var(--ok); font-weight: 600; }
#log.lines .hot { color: var(--text); background: var(--panel-2); }
#log.lines .live { color: var(--text); font-weight: 600; }
#log.lines .app { color: var(--muted); }
#log.lines .who { color: var(--muted); font-weight: 600; margin-right: 8px; }
#log a.src { color: inherit; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.empty { color: var(--muted); padding: 28px 16px; font: 13px/1.6 var(--ui); max-width: 640px; white-space: normal; }

/* 반영 기록 표 */
.ev, .ev-head {
	display: grid; grid-template-columns: 64px 64px 96px minmax(0, 1fr) 64px; gap: 0 12px; align-items: baseline;
	padding: 5px 14px;
}
.ev-head {
	font-size: 11.5px; font-weight: 600; color: var(--muted); background: var(--panel);
	border-bottom: 1px solid var(--line); padding-top: 6px; padding-bottom: 6px; padding-right: 24px;
}
.ev { border-bottom: 1px solid var(--line-soft); }
.ev:hover { background: var(--panel-2); }
.ev.err { background: var(--crit-weak); }
.ev.warn { background: var(--warn-weak); }
.ev .t { color: var(--muted); font-size: 12px; }
.ev .who { font-size: 12px; color: var(--muted); }
/* 2026-10-28 : docket Chip — 20px 알약 · 1px 테두리. 바로 반영 · 클래스 교체(info · hot)는 무채색이고 칩 글자로만 가른다. */
.ev .k {
	justify-self: start; display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 999px;
	font-size: 11.5px; font-weight: 500; white-space: nowrap;
	background: var(--panel-2); color: var(--muted); border: 1px solid var(--line);
}
.ev .k.info, .ev .k.hot { color: var(--text); border-color: var(--line-strong); }
.ev .k.ok { background: var(--ok-weak); color: var(--ok); border-color: color-mix(in oklch, var(--ok) 30%, transparent); }
.ev .k.warn { background: var(--warn-weak); color: var(--warn); border-color: var(--warn-line); }
.ev .k.crit { background: var(--crit-weak); color: var(--crit); border-color: var(--crit-line); }
/* 2026-10-28 : 내용은 한 줄로 접고 흐린 글씨로 둔다. 긴 경로 · 기동 단계 줄이 여러 줄로 늘어나 표가 어지러웠다.
   넘치는 줄(.fold)만 눌러서 펼치고, 펼친 줄은 본문 색으로 되돌려 지금 읽는 줄이 드러나게 한다. */
.ev .m { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev.open .m { color: var(--text); white-space: normal; overflow-wrap: anywhere; }
.ev.fold { cursor: pointer; }
/* 꺾쇠 자리는 모든 줄에 비워 둔다 — 줄마다 글 시작이 어긋나지 않고, 꺾쇠가 붙고 떨어져도 넘침 판정이 흔들리지 않는다 */
.ev .m::before { content: ""; display: inline-block; width: 12px; color: var(--faint); font-size: 10px; }
.ev.fold .m::before { content: "▸"; }
.ev.open .m::before { content: "▾"; }
.ev .m .mono, .alert-text .mono { font-size: 12px; }
.ev .errs { grid-column: 4 / -1; margin: 3px 0 1px; }
.ev .errs a { display: block; font: 12px/1.6 var(--mono); color: var(--crit); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; overflow-wrap: anywhere; }
.ev .errs a.more { font-family: var(--ui); color: var(--muted); }
.ev .d { text-align: right; color: var(--muted); font-size: 12px; }

/* ---------- 상태 · 설정 쪽 ----------
   2026-10-28 : 780px 한 줄 → 넓은 창을 쓰는 카드 격자(상태). 설정은 아래에서 한 기둥 목록으로 다시 바꿨다. */
.pane.page { overflow: auto; }
.page-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 12px; max-width: 1400px; padding: 16px 20px 40px; }
.card { min-width: 0; padding: 12px 16px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.card.span { grid-column: 1 / -1; }
.card h2 { font-size: 14px; font-weight: 600; margin: 0 0 6px; }
.note { padding: 8px 12px; border: 1px solid var(--warn-line); background: var(--warn-weak); color: var(--warn); border-radius: 6px; margin-bottom: 16px; }

/* 설정 — 2026-10-28 : 탭 한 쪽의 한 기둥 → 모달. 왼쪽 구획 목록에서 고른 구획 하나만 오른쪽에 보인다.
   한 기둥으로 늘어놓으니 넓은 창에서 오른쪽이 비고, 구획이 여덟 개라 스크롤로 찾기 어려웠다. */
.scrim.set-scrim { z-index: 15; padding: 24px; }
.dlg.settings {
	display: grid; grid-template-columns: 200px minmax(0, 1fr); max-width: 1040px; height: min(720px, 100%);
	padding: 0; overflow: hidden; background: var(--bg);
}
.set-nav { display: flex; flex-direction: column; gap: 1px; padding: 16px 8px; background: var(--side); border-right: 1px solid var(--line); overflow: auto; }
.set-nav h2 { margin: 0 0 6px; padding: 0 10px; font-size: 14px; font-weight: 600; }
.set-nav .grp { margin: 14px 0 4px; padding: 0 10px; font-size: 11px; font-weight: 600; color: var(--faint); }
.set-nav button {
	display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; flex: none;
	border: 0; border-radius: 6px; background: none; color: var(--muted); font: 500 13px var(--ui); text-align: left; cursor: pointer;
}
.set-nav button .ic { color: var(--faint); }
.set-nav button:hover { background: var(--panel-2); color: var(--text); }
.set-nav button.on { background: var(--panel); color: var(--text); font-weight: 600; box-shadow: inset 0 0 0 1px var(--line); }
.set-nav button.on .ic { color: var(--text); }
.set-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.set-head { display: flex; align-items: center; gap: 8px; flex: none; height: 52px; padding: 0 10px 0 28px; background: var(--panel); border-bottom: 1px solid var(--line); }
.set-head h3 { flex: 1; margin: 0; font-size: 14px; font-weight: 600; }
.set-head .btn { width: 28px; padding: 0; justify-content: center; }
.set-body { flex: 1; min-height: 0; overflow: auto; padding: 20px 28px 32px; }
.set-body .note { margin-bottom: 14px; }
.set-err { margin-bottom: 14px; padding: 8px 12px; border: 1px solid var(--crit-line); background: var(--crit-weak); color: var(--crit); border-radius: 6px; cursor: pointer; overflow-wrap: anywhere; }
.set-sec h3 { margin: 20px 0 8px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.set-sec h3:first-child { margin-top: 0; }
@media (max-width: 720px) {
	.scrim.set-scrim { padding: 8px; }
	.dlg.settings { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); height: 100%; }
	.set-nav { flex-direction: row; padding: 8px; border-right: 0; border-bottom: 1px solid var(--line); }
	.set-nav h2, .set-nav .grp { display: none; }
}

/* 옵션 줄 — 2026-10-28 : 설명을 단 카드 격자 → 이름 · 조작 한 줄의 목록. 설명은 줄의 title 로 옮겼다.
   딸린 옵션(.sub)은 부모 아래 들여 써서 「무엇에 딸렸는지」를 글 대신 자리로 보인다. */
.opts { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.opt {
	display: flex; align-items: center; gap: 16px; min-height: 38px; padding: 6px 14px;
	border-top: 1px solid var(--line-soft); cursor: pointer;
}
.opt:first-child { border-top: 0; }
.opt:hover { background: var(--panel-2); }
.opt > span { flex: 1; min-width: 0; }
.opt.sub { padding-left: 38px; }
.opt.off { opacity: .5; }
.opt.field { cursor: default; }
.opt.field select { width: 180px; }
.opt .val { flex: none; color: var(--muted); font-size: 12px; }
.opt.flash { outline: 2px solid var(--ring); outline-offset: -2px; }
/* 스위치 — 체크박스 그대로라 키보드 · 라벨 누르기가 그대로 된다 */
.opt input[type=checkbox] {
	order: 2; appearance: none; position: relative; width: 30px; height: 18px; margin: 1px 0 0;
	border-radius: 9px; background: var(--line-strong); cursor: pointer; transition: background .12s;
}
.opt input[type=checkbox]::before {
	content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%;
	background: var(--panel); transition: transform .12s;
}
/* docket Switch — 켜지면 본문 색 판에 바탕 색 손잡이 */
.opt input[type=checkbox]:checked { background: var(--text); }
.opt input[type=checkbox]:checked::before { transform: translateX(12px); }
.tag { font: 600 11px var(--ui); color: var(--muted); border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; margin-left: 6px; vertical-align: 1px; }

.pat { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; margin: 0 0 10px; font-size: 12px; color: var(--muted); }
.pat dt, .pat dd { margin: 0; }
.pat .ex { font-family: var(--mono); font-size: 12px; color: var(--text); background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: 4px; padding: 0 4px; cursor: pointer; }
.pat .ex:hover, .pat .ex:focus-visible { border-color: var(--line); }
.ign { list-style: none; margin: 0 0 8px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.ign li { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 3px 6px 3px 12px; border-top: 1px solid var(--line-soft); }
.ign li:first-child { border-top: 0; }
.ign li .mono { flex: 1; min-width: 0; font-size: 12px; overflow-wrap: anywhere; }
.ign li.builtin { color: var(--muted); cursor: default; }
.ign li.builtin .tag { margin: 0 2px 0 0; }
.ign-add { display: flex; gap: 6px; margin-bottom: 10px; }
.ign-add input { flex: 1; min-width: 0; font-family: var(--mono); }

.mem { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
.mem b { font-weight: 600; }
.mem .bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.mem .bar i { display: block; height: 100%; background: var(--muted); }
.mem .bar i.hi { background: var(--warn-solid); }
.mem small { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
.mem:last-child, .ph:last-child { border-bottom: 0; }

.ph { padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
.ph-top { display: flex; justify-content: space-between; }
.ph-bar { display: flex; height: 10px; margin: 6px 0 4px; border-radius: 3px; overflow: hidden; background: var(--panel-2); }
.ph-bar i { display: block; height: 100%; border-right: 1px solid var(--panel); }
.ph-bar i:last-child { border-right: 0; }
.ph-legend { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 2px 14px; }
.ph-legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 6px; background: var(--c); }

.checks { list-style: none; margin: 0; padding: 0; }
.checks li { display: grid; grid-template-columns: 16px 120px minmax(0, 1fr); gap: 0 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--line-soft); }
.checks .ic { color: var(--ok); align-self: center; }
.checks li.bad .ic { color: var(--crit); }
.checks li.bad span { color: var(--crit); }
.checks li.warn .ic, .checks li.warn span { color: var(--warn); }
.checks li.warn .ic { align-self: start; margin-top: 2px; }
.checks li.warn small { white-space: pre-line; word-break: normal; font-family: var(--ui); line-height: 1.55; }
.checks small { color: var(--muted); word-break: break-all; font-family: var(--mono); font-size: 12px; }
.checks li.pre small { white-space: pre-line; word-break: normal; overflow-wrap: anywhere; }
.checks li.pre .ic { align-self: start; margin-top: 2px; }
.check-acts { grid-column: 3; margin-top: 6px; }
.checks-sub { margin: 14px 0 4px; font-weight: 600; font-size: 12.5px; }
.check-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 0 28px; }
.check-cols .checks-sub { margin-top: 4px; }
.check-cols .checks li:last-child { border-bottom: 0; }
.folders { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- 버전 관리 (SVN · Git 읽기 전용) ---------- */
.svn-bar { gap: 10px; }
.svn-info { color: var(--muted); flex: 1; min-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.svn-info b { color: var(--text); font-weight: 600; }
.svn-info a, .svn-list .empty a { color: inherit; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-strong); }
.svn-info a:hover, .svn-list .empty a:hover { text-decoration-color: currentColor; }
.svn-body { flex: 1; display: grid; grid-template-columns: minmax(280px, 40%) 1fr; min-height: 0; }
.svn-list { overflow: auto; border-right: 1px solid var(--line); background: var(--panel); }
.svn-list .row { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 0 8px; align-items: start; padding: 6px 12px; border-bottom: 1px solid var(--line-soft); cursor: pointer; }
.svn-list .row:hover { background: var(--panel-2); }
.svn-list .row.on { background: var(--panel-2); box-shadow: inset 2px 0 0 var(--text); }
.svn-list .row input { margin-top: 2px; }
.svn-list .code { font-size: 11px; font-weight: 600; border-radius: 4px; padding: 0 6px; line-height: 18px; white-space: nowrap; color: var(--muted); background: var(--panel-2); }
.svn-list .code.M { color: var(--text); }
.svn-list .code.A { color: var(--ok); background: var(--ok-weak); }
.svn-list .code.D, .svn-list .code.\! { color: var(--crit); background: var(--crit-weak); }
.svn-list .code.C { color: #fff; background: var(--crit-solid); }
.svn-list .p { color: var(--muted); font-family: var(--mono); font-size: 12px; }
.svn-list .p b { font-weight: 600; color: var(--text); white-space: nowrap; }
.svn-list .p small { display: block; color: var(--muted); font: 12px var(--ui); }
.svn-list .flag, .svn-info .flag { color: var(--crit); font-weight: 600; }
.svn-group { padding: 8px 12px; color: var(--crit); font-size: 12px; background: var(--crit-weak); border-bottom: 1px solid var(--line); }
.svn-diff { overflow: auto; font: 12px/1.5 var(--mono); background: var(--panel); }
.svn-diff .head { position: sticky; top: 0; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); font: 13px/1.45 var(--ui); }
.svn-diff .head b { font-family: var(--mono); font-size: 12.5px; font-weight: 600; }
.svn-diff .head small { display: block; color: var(--muted); font-size: 12px; }
.svn-diff .head .add { color: var(--ok); font-weight: 600; }
.svn-diff .head .del { color: var(--crit); font-weight: 600; }
.svn-diff .head .acts { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
.svn-diff table { border-collapse: collapse; width: 100%; }
.svn-diff td { padding: 0 8px; vertical-align: top; white-space: pre-wrap; word-break: break-all; }
.svn-diff td.no { color: var(--faint); text-align: right; width: 1%; white-space: nowrap; user-select: none; }
.svn-diff tr.add td.s { background: var(--ok-weak); }
.svn-diff tr.del td.s { background: var(--crit-weak); }
.svn-diff tr.add td.s::before { content: "+ "; color: var(--ok); }
.svn-diff tr.del td.s::before { content: "- "; color: var(--crit); }
.svn-diff tr.ctx td.s::before { content: "  "; }
.svn-diff tr.hunk td { color: var(--muted); background: var(--line-soft); padding: 2px 8px; }
.svn-diff .empty { font-family: var(--ui); }
.svn-foot { display: flex; gap: 8px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.svn-foot input { flex: 1; min-width: 240px; }
.svn-note { color: var(--muted); font-size: 12px; }
/* Commit message 규칙 경고 — 단추 줄 아래 한 줄. 막지 않으므로 오류색이 아니라 호박색 */
.svn-foot .msg-warn { flex-basis: 100%; order: 9; color: var(--warn); font-size: 12px; }
.svn-log { padding: 8px 12px; border-bottom: 1px solid var(--line-soft); }
.svn-log .r { font-weight: 600; margin-right: 8px; font-family: var(--mono); }
.svn-log .who { color: var(--muted); font-size: 12px; }
.svn-log .msg { margin: 3px 0 4px; white-space: pre-wrap; word-break: break-all; }
.svn-log .cp { display: flex; gap: 8px; padding: 1px 6px; border-radius: 4px; cursor: pointer; font-size: 12px; word-break: break-all; }
.svn-log .cp:hover { background: var(--panel-2); }
.svn-log .cp.on { background: var(--panel-2); box-shadow: inset 2px 0 0 var(--text); }
.svn-log .cp.out { color: var(--faint); cursor: default; }
.svn-log .cp .a { font-weight: 700; width: 12px; flex: none; font-family: var(--mono); }
.svn-log .cp .a.A { color: var(--ok); }
.svn-log .cp .a.D { color: var(--crit); }
.svn-log .cp .a.M, .svn-log .cp .a.R { color: var(--text); }
.svn-log .cp .mine { color: var(--crit); font-weight: 600; white-space: nowrap; }
.svn-login { padding: 20px; max-width: 420px; font: 13px/1.5 var(--ui); }
.svn-login h3 { margin: 0 0 6px; font-size: 14px; font-weight: 600; }
.svn-login p { color: var(--muted); margin: 0 0 14px; }
.svn-login label.f { display: block; font-weight: 600; font-size: 12px; margin-bottom: 4px; }
.svn-login input[type=text], .svn-login input[type=password] { display: block; width: 100%; margin-bottom: 12px; }
.svn-login .chk { margin-bottom: 14px; }
.svn-login .err { color: var(--crit); margin-bottom: 10px; min-height: 0; }
.svn-login .row-btns { display: flex; gap: 6px; }
/* 쓰기 확인 · 충돌 판 · Blame (2026-10-29) */
.dlg.vcs-dlg { max-width: 540px; }
.dlg.vcs-dlg p { line-height: 1.55; white-space: pre-wrap; }
.dlg.vcs-dlg p .flag { color: var(--crit); font-weight: 600; }
.dlg.vcs-dlg ul { max-height: 280px; overflow: auto; }
.dlg.vcs-dlg li span:first-child { font: 12px var(--mono); word-break: break-all; }
.svn-conflict { margin-top: 8px; padding: 8px 10px; border-radius: 6px; background: var(--crit-weak); font-size: 12px; }
.svn-conflict b { color: var(--crit); }
.svn-conflict .acts { margin-top: 6px; }
.svn-diff.busy .acts .btn, .svn-foot.busy .btn { pointer-events: none; opacity: .55; }
.svn-diff table.blame td.g { width: 1%; white-space: nowrap; color: var(--muted); background: var(--panel-2); font-size: 11.5px; cursor: pointer; }
.svn-diff table.blame td.g.none { cursor: default; }
.svn-diff table.blame td.g:hover:not(.none) { color: var(--text); }
.svn-diff table.blame tr.n td { border-top: 1px solid var(--line-soft); }
.svn-log .undo { float: right; margin-left: 8px; }
.vcs-srv .svn-note { word-break: break-all; }
.vcs-srv .svn-note.flag { color: var(--crit); }
.vcs-srv .svn-get { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
.vcs-srv .svn-get .btn { flex: none; }
.vcs-srv .svn-get .svn-note { word-break: keep-all; min-width: 0; }
.vcs-srv .svn-get .svn-note:not(.flag) { white-space: nowrap; }
.vcs-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 8px; }
.vcs-srv { min-width: 0; padding: 10px 14px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.vcs-srv .checks-sub { display: flex; align-items: center; gap: 6px; margin: 0 0 6px; font-size: 13px; }
.vcs-srv [data-k=found] { display: flex; gap: 4px; }
.vcs-srv .checks-sub .k { font: 600 11px/18px var(--ui); padding: 0 6px; border-radius: 4px; background: var(--panel-2); color: var(--muted); }
/* 2026-10-28 : 라벨 위 · 설명 · 입력의 세 단 → 라벨 왼쪽 · 입력 오른쪽 한 줄. 설명은 라벨의 title 에 둔다. */
.vcs-srv .field { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 0 10px; align-items: center; padding: 3px 0; }
.vcs-srv .field > span { color: var(--muted); }
.vcs-srv .field input[type=text], .vcs-srv .field select { width: 100%; }
.vcs-srv .field input[type=text] { font-family: var(--mono); font-size: 12px; }
.vcs-acts { display: flex; justify-content: flex-end; padding-top: 6px; }
.vcs-srv .field textarea { width: 100%; min-height: 54px; resize: vertical; font: 12px/1.5 var(--mono); }
.vcs-srv .field.top { align-items: start; }
.vcs-srv .field.top > span { padding-top: 4px; }
/* 바로가기 줄 (이름 · 주소 · 빼기) · 프로젝트 폴더 칸 옆 「고르기」 */
.vcs-srv .links { display: grid; gap: 4px; }
.vcs-srv .link-row, .vcs-srv .pick { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr) auto; gap: 4px; align-items: center; }
.vcs-srv .pick { grid-template-columns: minmax(0, 1fr) auto; }
.vcs-srv .links + .btn { justify-self: start; margin-top: 4px; }
.vcs-srv .field.top > div { display: grid; }
.vcs-srv.flash { outline: 2px solid var(--ring); outline-offset: -2px; }
/* 설정 › 업데이트 › 변경 기록 — CHANGELOG.md 를 판마다 접어 보인다 */
.chlog { margin-top: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.chlog details { border-top: 1px solid var(--line); }
.chlog details:first-child { border-top: 0; }
.chlog summary { display: flex; align-items: center; gap: 8px; padding: 8px 14px; cursor: pointer; font-weight: 600; list-style: none; }
.chlog summary::-webkit-details-marker { display: none; }
.chlog summary::before { content: "▸"; color: var(--muted); font-size: 11px; width: 10px; }
.chlog details[open] summary::before { content: "▾"; }
.chlog summary .date { color: var(--muted); font-weight: 400; font-size: 12px; }
.chlog summary .k { font: 600 11px/18px var(--ui); padding: 0 6px; border-radius: 4px; background: var(--panel-2); color: var(--muted); }
.chlog summary .k.new { background: var(--ok-weak); color: var(--ok); }
.chlog ul { margin: 0; padding: 0 14px 10px 38px; }
.chlog li { margin: 3px 0; line-height: 1.55; }
.chlog code { font: 12px var(--mono); padding: 0 3px; border-radius: 3px; background: var(--panel-2); }
.chlog ul:has(> .it) { padding-left: 24px; }
.chlog li.it { list-style: none; margin: 0 0 6px; padding-left: 10px; border-left: 2px solid var(--line); }
.chlog li.it > b { font-weight: 600; }
.chlog .tog { margin-left: 6px; padding: 0; border: 0; background: none; color: var(--muted); font: 12px var(--ui); cursor: pointer; }
.chlog .tog:hover { color: var(--text); }
.chlog .rest { display: none; margin-top: 2px; color: var(--muted); font-size: 12px; }
.chlog li.open .rest { display: block; }
.chlog .more { display: block; width: 100%; padding: 7px; border: 0; border-top: 1px solid var(--line); background: none; color: var(--muted); cursor: pointer; font: inherit; }
.set-sec .sec-acts { display: flex; align-items: center; gap: 8px; margin-top: 8px; color: var(--muted); font-size: 12px; }

/* ---------- 상태 표시줄 · 메뉴 · 알림 ---------- */
/* 2026-10-28 : 켜진 설정을 「·」 로 이은 한 줄 → 묶음(반영 · 기동 · 앱)별 칩. 칩을 누르면 설정의 그 칸으로 간다. */
.statusbar {
	display: flex; align-items: center; gap: 12px; height: 28px; padding: 0 6px 0 8px;
	background: var(--panel); border-top: 1px solid var(--line); font-size: 12px; color: var(--muted);
}
.statusbar button { border: 0; background: none; color: inherit; font: inherit; padding: 0 6px; height: 20px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
.statusbar button:hover { background: var(--panel-2); color: var(--text); }
.sb-opts { flex: 1; min-width: 0; display: flex; align-items: center; overflow: hidden; }
.sb-group { display: flex; align-items: center; gap: 4px; flex: none; }
.sb-group + .sb-group { margin-left: 8px; padding-left: 8px; border-left: 1px solid var(--line); }
.sb-label { color: var(--faint); font-size: 11px; margin-right: 2px; }
.statusbar .sb-item { display: inline-flex; align-items: center; gap: 4px; padding: 0 7px; color: var(--text); background: var(--panel-2); }
.statusbar .sb-item:hover { background: var(--line-soft); }
.sb-item .ic { width: 12px; height: 12px; color: var(--muted); stroke-width: 2.2; }
.statusbar .sb-item.off { color: var(--faint); background: none; text-decoration: line-through; }
.sb-item b { font-weight: 600; font-family: var(--mono); }
#sbMem { display: inline-flex; align-items: center; gap: 4px; flex: none; }
#sbMem b { color: var(--text); font-weight: 600; font-family: var(--mono); margin-right: 6px; }
#sbMem b:last-child { margin-right: 0; }
/* 떠 있는 것(메뉴 · 알림 조각 · 대화상자)만 그림자를 단다 — docket .pop. 바닥에 붙은 판은 선으로만 나눈다. */
.menu {
	position: fixed; z-index: 25;   /* 설정 모달(15) · 시작하기(20) 안에서도 연다 */
	 min-width: 240px; max-width: 520px; max-height: calc(100vh - 16px); overflow: auto; padding: 4px; background: var(--panel);
	border: 1px solid var(--line-strong); border-radius: 8px; box-shadow: var(--shadow-pop);
}
.menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 6px 10px; border-radius: 5px; font: 13px var(--ui); color: var(--text); cursor: pointer; }
.menu button:hover, .menu button:focus-visible { background: var(--panel-2); outline: none; }
/* 2026-10-28 : 우클릭 메뉴의 구분선 · 지금 할 수 없는 항목 (지운 파일의 「편집기로 열기」 등) */
.menu button:disabled { color: var(--faint); background: none; cursor: default; }
.menu hr { border: 0; border-top: 1px solid var(--line-soft); margin: 4px 2px; }
.menu small { display: block; color: var(--muted); font-family: var(--mono); font-size: 11.5px; overflow-wrap: anywhere; }
.toast {
	position: fixed; right: 16px; bottom: 40px; z-index: 26; display: flex; align-items: center; gap: 8px;
	padding: 8px 14px; background: var(--panel); color: var(--text); border-radius: 6px;
	border: 1px solid var(--line-strong); box-shadow: var(--shadow-pop); font-size: 12.5px;
	opacity: 0; transform: translateY(6px); transition: opacity .18s ease-out, transform .18s ease-out; pointer-events: none;
}
.toast.show { opacity: 1; transform: none; }

/* ---------- 닫기 확인 (2026-10-28) ---------- */
.scrim {
	position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
	padding: 16px; background: rgba(0, 0, 0, .32);
}
.dlg {
	width: 100%; max-width: 380px; padding: 18px 18px 14px; background: var(--panel); color: var(--text);
	border: 1px solid var(--line-strong); border-radius: 8px; box-shadow: var(--shadow-pop);
}
.dlg h2 { margin: 0 0 6px; font-size: 14px; font-weight: 600; }
.dlg p { margin: 0; color: var(--muted); }
.dlg ul { margin: 10px 0 0; padding: 0; list-style: none; }
.dlg li { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-top: 1px solid var(--line-soft); }
.dlg li span:last-child { color: var(--muted); }
.dlg .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

/* 시작하기 — 처음 켰을 때 (프로젝트를 정한 서버가 하나도 없을 때) 뜬다 */
.dlg.setup { max-width: 520px; }
.dlg.setup p { line-height: 1.55; }
.setup .ws { margin-top: 12px; font: 12px var(--mono); color: var(--muted); }
.setup ul.pick li { justify-content: flex-start; align-items: center; gap: 10px; padding: 8px 2px; cursor: pointer; }
.setup ul.pick li.off { cursor: default; opacity: .55; }
.setup ul.pick li b { font-weight: 600; }
.setup ul.pick li .meta { color: var(--muted); font-size: 12px; margin-left: auto; text-align: right; }
/* 이클립스와 다르게 도는 것 — 서버 줄 아래로 내려 접히게 한다 */
.setup ul.pick li { flex-wrap: wrap; }
.setup ul.pick li .warns { flex-basis: 100%; margin: 2px 0 0 26px; color: var(--warn); font-size: 12px; line-height: 1.55; }
.setup ul.pick li .warns div { display: flex; gap: 6px; align-items: flex-start; margin-top: 2px; }
.setup ul.pick li .warns .ic { flex: none; width: 13px; height: 13px; margin-top: 3px; }
.setup .tc { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 8px 10px; border-radius: 6px; background: var(--warn-weak); color: var(--text); font-size: 12px; }
.setup .tc span { flex: 1; }
.setup .jndi { margin-top: 12px; padding: 8px 10px; border-radius: 6px; background: var(--warn-weak); font-size: 12px; line-height: 1.55; }
.setup .jndi label { display: flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; }
.setup .jndi .names { font: 12px var(--mono); margin: 2px 0 4px 24px; word-break: break-all; }
.setup .jndi p { margin: 0 0 0 24px; color: var(--muted); }
.setup .acts .left { margin-right: auto; }
</style>
</head>

	<!-- 반영 기록 · 서버 로그 · 빌드 : 같은 자리를 나눠 쓴다 -->
	<section class="pane" id="paneLog">
		<div class="toolbar">
			<div class="seg" id="evSrv"></div>
			<button class="btn" id="logFolder"><svg class="ic"><use href="#i-folder"/></svg>로그 폴더</button>
			<div class="end">
				<label class="search"><svg class="ic"><use href="#i-search"/></svg><input type="search" id="filter" placeholder="찾기 (Ctrl+F)"></label>
				<label class="chk"><input type="checkbox" id="onlyErr">오류만</label>
				<label class="chk"><input type="checkbox" id="follow" checked>따라가기</label>
				<button class="btn ghost" id="btnClear">지우기</button>
			</div>
		</div>
		<div id="buildCtl"></div>
		<div class="ev-head" id="evHead"><span>시각</span><span>서버</span><span>구분</span><span>내용</span><span style="text-align:right">걸린 시간</span></div>
		<div id="log"></div>
	</section>

	<!-- 버전 관리 (SVN · Git · 쓰기는 「Allow write」를 켠 서버에서 사용자가 누를 때만) -->
	<section class="pane" id="paneSvn" hidden>
		<div class="toolbar svn-bar">
			<div class="seg" id="svnSrv"></div>
			<div class="seg" id="vcsKind" hidden></div>
			<div class="seg" id="svnViews">
				<button data-view="local" class="on" title="작업복사본에서 바뀐 파일 (저장소에 묻지 않습니다)">Changes</button>
				<button data-view="incoming" title="저장소에 새 커밋이 있는지, Update 하면 무엇이 들어오는지">Incoming</button>
				<button data-view="log">Log</button>
			</div>
			<span class="svn-info" id="svnInfo">읽는 중...</span>
			<label class="chk" id="svnUnverBox"><input type="checkbox" id="svnUnver"><span id="svnUnverText">Show unversioned</span></label>
			<button class="btn" id="svnAccount" title="저장소 계정 (Windows 자격 증명 관리자)"><svg class="ic"><use href="#i-user"/></svg>계정</button>
			<button class="btn" id="svnRefresh"><svg class="ic"><use href="#i-restart"/></svg>새로 고침</button>
		</div>
		<div class="svn-body">
			<div class="svn-list" id="svnList"></div>
			<div class="svn-diff" id="svnDiff"></div>
		</div>
		<div class="svn-foot" id="svnCommit">
			<input type="text" id="svnMsg" placeholder="Commit message">
			<button class="btn" id="svnGenMsg" hidden><svg class="ic"><use href="#i-bolt"/></svg><span>자동 생성</span></button>
			<span class="msg-warn" id="svnMsgWarn" hidden></span>
			<button class="btn" id="svnCopyList"><svg class="ic"><use href="#i-copy"/></svg>고른 파일 목록 복사</button>
			<button class="btn" id="svnCopyCmd"><svg class="ic"><use href="#i-copy"/></svg>Commit 명령 복사</button>
			<button class="btn" id="svnRevert" hidden title="고른 파일의 고친 내용을 버리고 BASE 로 되돌립니다">Revert…</button>
			<button class="btn primary" id="svnDoCommit" hidden><svg class="ic"><use href="#i-check"/></svg><span>Commit</span></button>
		</div>
		<div class="svn-foot" id="svnUpdateBar" style="display:none">
			<button class="btn" id="svnCopyUpdate"><svg class="ic"><use href="#i-copy"/></svg>Update 명령 복사</button>
			<button class="btn" id="svnCopyFetch" hidden><svg class="ic"><use href="#i-copy"/></svg>Fetch 명령 복사</button>
			<button class="btn" id="svnDoFetch" hidden title="원격 추적 브랜치만 새로 고칩니다. 작업 파일은 바뀌지 않고 Incoming 이 최신이 됩니다."><svg class="ic"><use href="#i-restart"/></svg><span>Fetch</span></button>
			<button class="btn primary" id="svnDoUpdate" hidden><svg class="ic"><use href="#i-download"/></svg><span>Update</span></button>
			<button class="btn" id="svnDoPush" hidden title="올릴 커밋을 확인 창에서 본 뒤 원격 추적 브랜치에 올립니다."><svg class="ic"><use href="#i-upload"/></svg><span>Push</span></button>
			<span class="svn-note" id="svnUpdateNote" style="width:auto;flex:1"></span>
		</div>
	</section>

	<!-- 상태 : 메모리 · 기동 시간 · 준비 상태 · 폴더
	     2026-10-28 : 780px 한 줄 세로 나열 → 카드 격자. 넓은 창에서 메모리와 기동 시간을 나란히 보고, 준비 상태는 공통 · 서버별을 칸으로 나눈다. -->

				<!-- 프로젝트 폴더 · 포트 · 접속 주소처럼 쓰는 곳마다 다른 값은 실행기에 들어 있지 않다. 여기서 정하면 tomcatrun.json 에 저장된다. -->

				<section class="set-sec" id="setLive">
					<div class="opts">

				<section class="set-sec" id="setBoot">

						<label class="opt" title="빈을 처음 쓸 때 만듭니다. 기동이 짧아지는 대신 처음 여는 화면이 그만큼 느리고, 설정 오류가 그때 드러납니다. 예약 작업도 그 화면을 열 때까지 돌지 않습니다."><input type="checkbox" id="optLazy"><span>지연 초기화<span class="tag">실험</span></span></label>
						<label class="opt" title="정상 종료 때 세션을 저장했다가 되살립니다 (톰캣 기본 동작)."><input type="checkbox" id="optSession"><span>재시작해도 로그인 유지</span></label>
					</div>

				<!-- 「기본」 줄은 app/src/main.rs 의 늘 빼는 규칙(편집기 임시 파일 · resources-* · java/ · webapp/ 사본)을 그대로 적은 것이다. 그쪽을 바꾸면 renderIgnore 의 IGNORE_BUILTIN 도 고친다. -->

							title="여기 걸린 파일은 저장해도 반영 기록 · 재시작 알림 · 자동 컴파일에 넣지 않습니다. 버전 관리 「Changes」 목록에는 그대로 나옵니다.&#10;탐색기에서 복사한 전체 경로도 프로젝트 기준으로 바뀌고, 여러 줄을 붙여 넣으면 줄마다 하나씩 들어갑니다.&#10;「/」 가 없으면 이름으로 맞춥니다. 같은 이름의 폴더가 있으면 그 아래도 빠집니다.">

					</div>

<script>
(function () {
	var T = window.__TAURI__;
	var invoke = T.core.invoke;
	var listen = T.event.listen;
	// 창 제목에 지금 문제를 적는다 — 최소화해 두었을 때 작업 표시줄에서 보인다
	var appWin = null;
	try { appWin = T.window.getCurrentWindow(); } catch (e) { /* 창 API 가 없으면 제목을 그대로 둔다 */ }

	// 제목 줄 단추 — 창 API 가 없으면 단추가 할 일이 없으므로 제목 줄째 숨긴다
	var MAX_ICON = '<rect x=".5" y=".5" width="9" height="9"/>';
	var RESTORE_ICON = '<rect x=".5" y="2.5" width="7" height="7"/><path d="M2.5 2.5V.5h7v7h-2"/>';
	if (appWin) {
		document.getElementById("tbMin").onclick = function () { appWin.minimize(); };
		document.getElementById("tbMax").onclick = function () { appWin.toggleMaximize(); };
		document.getElementById("tbClose").onclick = function () { appWin.close(); };   // 닫기 요청 → 톰캣이 켜져 있으면 실행기가 「close-ask」로 묻는다
		var syncMax = function () {
			appWin.isMaximized().then(function (m) {
				var b = document.getElementById("tbMax");
				b.firstChild.innerHTML = m ? RESTORE_ICON : MAX_ICON;
				b.title = m ? "이전 크기로" : "최대화";
				b.setAttribute("aria-label", b.title);
			}).catch(function () { /* 알 수 없으면 아이콘을 그대로 둔다 */ });
		};
		window.addEventListener("resize", syncMax);
		syncMax();
	} else {
		document.getElementById("titlebar").hidden = true;
	}
	// 다른 창을 보고 있으면 제목 줄을 흐리게 (Windows 제목 줄과 같은 동작)
	window.addEventListener("blur", function () { document.body.classList.add("blur"); });
	window.addEventListener("focus", function () { document.body.classList.remove("blur"); });

	// 2026-10-27 : 8000 · 3000 → 5000 · 2000. 화면 엔진 메모리를 줄이려는 것 (전체 로그는 logs/console.log 에 있다)
	var MAX = 5000;      // 탭마다 들고 있는 줄 수
	var SHOW = 2000;     // 다시 그릴 때 보여 주는 줄 수
	var APP_TITLE = "tomcatrun";
	var STATUS_TEXT = { stopped: "꺼짐", starting: "켜는 중", running: "실행 중", stopping: "끄는 중" };
	// javac 오류 줄의 「파일:줄:」 — 눌러서 편집기로 연다
	var SRC_RE = /([A-Za-z]:[\\\/][^:*?"<>|\r\n]+?\.java):(\d+):/;
	// 기동 단계 색 — 회색 다섯 단계 (단계 순서가 곧 진하기). 2026-10-28 : 파랑 → 무채색. 단계 구분은 뜻이 아니라 순서라 상태 색을 쓰지 않는다.
	var PHASE_COLOR = ["oklch(0.86 0 0)", "oklch(0.74 0 0)", "oklch(0.62 0 0)", "oklch(0.5 0 0)", "oklch(0.38 0 0)"];

	var state = null;
	var memSnap = null;    // 3초마다 오는 메모리 (servers · daemon · launcher)
	var built = false;     // 뼈대를 만들었는가
	var builtSig = "";     // 뼈대를 만들 때의 서버 수 · 이름 · 포트 — 달라지면 서버 조각을 다시 짓는다
	var bootCfg = {};      // 서버별 이번 기동에 쓴 옵션 — 바꾸면 「다음 시작부터」 안내를 띄운다
	var tab = "events";
	var evSrv = -1;        // 반영 기록에서 볼 서버 (-1 은 모두)
	var store = {}, unread = {}, unreadErr = {};
	var errMsg = "";       // 실행기 명령이 돌려준 오류 — 닫을 때까지 알림 줄에 둔다
	var alertOpen = {};    // 알림 줄 목록을 펼친 것
	var updDismissed = ""; // 알림 줄에서 닫은 새 판 — 이번 실행에서는 다시 띄우지 않는다 (설정 › 업데이트에는 남는다)
	var javaDismissed = {}; // 알림 줄에서 닫은 「이클립스와 다른 자바」 (서버 id → 그 문구) — 문구가 바뀌면 다시 띄운다 (상태 탭에는 남는다)
	var lastTitle = "";
	var errBuf = {}, lastErrs = {};   // 서버별 컴파일 오류 줄 — 모으는 중 · 직전 컴파일 것

	var $ = function (id) { return document.getElementById(id); };
	var logEl = $("log");

	function esc(t) {
		return String(t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; });
	}
	function ic(name, cls) { return '<svg class="ic' + (cls ? " " + cls : "") + '"><use href="#i-' + name + '"/></svg>'; }
	function fmtDur(ms) {
		var s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
		if (h) return h + "시간 " + m + "분";
		if (m) return m + "분 " + (s % 60) + "초";
		return (s % 60) + "초";
	}
	function fmtTime(ms) {
		var d = new Date(ms);
		return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2) + ":" + ("0" + d.getSeconds()).slice(-2);
	}
	function fmtMb(mb) { return mb >= 1024 ? (mb / 1024).toFixed(1) + "GB" : mb + "MB"; }
	function baseName(p) { return String(p).split(/[\\\/]/).pop(); }

	/* ---------- 뼈대 (서버 수만큼) ---------- */

	// 서버 「바로가기」 메뉴 · 서버 칸 우클릭 메뉴가 같이 쓴다
	function linkItems(i) {
		var sv = state.servers[i];
		if (!sv.links.length) return [{ label: "설정에서 바로가기 추가", sub: sv.name + " · 설정 › 서버", run: function () { openSrvForm(i); } }];
		return sv.links.map(function (l) {
			var url = linkUrl(sv, l.url);
			return { label: l.label, sub: url, run: function () { invoke("open", { target: url }); } };
		});
	}

	function build(s) {
		$("tbVer").textContent = s.version;
		addTab("events", "반영 기록");
		s.servers.forEach(function (sv, i) {
			// 서버 줄
			var card = document.createElement("div");
			card.className = "srv";
			card.setAttribute("data-st", "stopped");
			card.setAttribute("data-srv", i);
			card.innerHTML =
				'<div class="srv-head"><span class="dot"></span><b class="srv-name">' + esc(sv.name) + '</b>' +
					'<span class="srv-port num">:' + sv.httpPort + '</span><span class="srv-state" data-k="state"></span></div>' +
				'<div class="srv-meta" data-k="meta"></div>' +
				'<div class="srv-acts">' +
					'<button class="btn primary" data-k="start">' + ic("play") + "시작</button>" +
					'<button class="btn" data-k="restart">' + ic("restart") + '<span data-k="rl">재시작</span></button>' +
					'<button class="btn" data-k="stop">' + ic("stop") + "중지</button>" +
					'<button class="btn" data-k="open" aria-haspopup="menu" title="브라우저로 엽니다">' + ic("external") + "바로가기" + ic("chev", "chev") + "</button>" +
				"</div>";
			$("servers").appendChild(card);
			var q = function (k) { return card.querySelector('[data-k="' + k + '"]'); };
			q("start").onclick = function () { hideError(); call("start", { srv: i }); };
			q("restart").onclick = function () { hideError(); call("restart", { srv: i }); };
			q("stop").onclick = function () { call("stop", { srv: i }); };
			q("open").onclick = function (ev) {
				ev.stopPropagation();
				openMenu(this, linkItems(i));
			};

			// 빌드 탭의 서버별 단추 줄
			var bc = document.createElement("div");
			bc.className = "bctl";
			bc.id = "bctl" + i;
			bc.innerHTML = "<b>" + esc(sv.name) + "</b>" +
				'<button class="btn" data-k="c">바뀐 파일 컴파일</button>' +
				'<button class="btn" data-k="ca" title="톰캣이 꺼져 있으면 비우고 처음부터 다시 만듭니다">전체 컴파일</button>' +
				'<button class="btn" data-k="deps" title="pom.xml 기준으로 Maven 이 다시 받습니다. 그 서버를 끈 상태에서만 됩니다">의존 jar 다시 받기</button>' +
				'<span class="bres" data-k="cl">아직 컴파일하지 않았습니다.</span>';
			$("buildCtl").appendChild(bc);
			bc.querySelector('[data-k="c"]').onclick = function () { call("compile", { srv: i, full: false }); };
			bc.querySelector('[data-k="ca"]').onclick = function () { call("compile", { srv: i, full: true }); };
			bc.querySelector('[data-k="deps"]').onclick = function () { hideError(); call("refresh_deps", { srv: i }); };

			// 반영 기록의 서버 거르기
			var fb = document.createElement("button");
			fb.textContent = sv.name;
			fb.setAttribute("data-s", i);
			$("evSrv").appendChild(fb);

			// 상태 탭 : 서버별 준비 상태 · 폴더
			var ck = document.createElement("div");
			ck.id = "checks" + i;
			ck.innerHTML = '<div class="checks-sub">' + esc(sv.name) + '</div><ul class="checks" data-k="list"></ul>';
			$("srvChecks").appendChild(ck);
			// 점검 줄의 단추 (checkAct) — 목록은 상태가 올 때마다 다시 그리므로 위에서 받는다
			ck.querySelector('[data-k="list"]').onclick = function (e) {
				var b = e.target.closest("[data-act]");
				if (b) dedupCall(i, b.getAttribute("data-act"));
			};
			var fo = document.createElement("button");
			fo.className = "btn";
			fo.innerHTML = ic("folder") + esc(sv.name) + " 톰캣 로그";
			fo.onclick = function () { invoke("open", { target: state.servers[i].catalinaBase + "/logs" }); };
			$("folders").appendChild(fo);

			addTab("srv" + i, sv.name + " 로그");
		});
		addTab("build", "빌드");
		addTab("svn", "버전 관리");
		addTab("status", "상태");
		// 설정은 탭이 아니라 모달이다 — 탭 줄 오른쪽 끝에 여는 단추만 둔다
		addTab("settings", "설정", true, "sliders");
		var setBtn = $("tabs").lastChild;
		setBtn.setAttribute("role", "button");
		setBtn.title = "설정 (Ctrl+,)";
		setBtn.onclick = function () { openSettings(); };

		var all = document.createElement("button");
		all.textContent = "모두";
		all.setAttribute("data-s", -1);
		$("evSrv").insertBefore(all, $("evSrv").firstChild);
		[].forEach.call($("evSrv").children, function (b) {
			b.onclick = function () { evSrv = +b.getAttribute("data-s"); renderEvSrv(); redraw(); };
		});
		renderEvSrv();

		[["설정 파일 (" + baseName(s.configPath) + ")", function () { return state.configPath; }], ["실행기 폴더", function () { return state.home; }]].forEach(function (x) {
			var b = document.createElement("button");
			b.className = "btn";
			b.innerHTML = ic("folder") + esc(x[0]);
			b.onclick = function () { invoke("open", { target: x[1]() }); };
			$("folders").appendChild(b);
		});
		svnBuild(s);
		srvBuild(s);
		vcsBuild(s);
		built = true;
		builtSig = shapeSig(s);
		renderTabs();
		showPane();
		redraw();
	}

	function shapeSig(s) {
		return JSON.stringify(s.servers.map(function (sv) { return [sv.name, sv.httpPort]; }));
	}
	// 서버를 더하거나 이클립스에서 가져와 서버 수 · 이름 · 포트가 바뀌었다 — 서버마다 붙는 조각을 걷고 다시 짓는다.
	// 2026-10-29 : 뼈대를 켤 때 한 번만 지어, 가져온 서버가 옛 이름 · 포트로 남거나 보이지 않아 실행기를 다시 열어야 했다. 쌓인 로그는 그대로 둔다.
	function rebuild(s) {
		["servers", "buildCtl", "evSrv", "folders", "svnSrv"].forEach(function (id) { $(id).textContent = ""; });
		var ck = $("srvChecks");
		while (ck.children.length > 1) ck.removeChild(ck.lastChild);   // 첫 칸은 「공통」
		[].slice.call($("tabs").querySelectorAll(".tab")).forEach(function (b) { b.remove(); });
		build(s);
	}

	// right : 탭 줄 오른쪽 끝에 둔다 (설정 단추)
	function addTab(name, label, right, icon) {
		var isLog = name === "events" || name === "build" || /^srv/.test(name);
		if (isLog && !store[name]) { store[name] = []; unread[name] = 0; unreadErr[name] = false; }
		var b = document.createElement("button");
		b.className = "tab";
		b.setAttribute("role", "tab");
		b.setAttribute("data-tab", name);
		b.innerHTML = (icon ? ic(icon) : "") + esc(label) + '<span class="n"></span>';
		b.onclick = function () { go(name); };
		var gap = $("tabs").querySelector(".gap");
		if (right) $("tabs").appendChild(b); else $("tabs").insertBefore(b, gap);
	}

	function go(name) {
		tab = name;
		if (store[name]) { unread[name] = 0; unreadErr[name] = false; }
		closeMenu();
		showPane();
		renderTabs();
		redraw();
	}

	function renderEvSrv() {
		[].forEach.call($("evSrv").children, function (b) { b.classList.toggle("on", +b.getAttribute("data-s") === evSrv); });
	}

	/* ---------- 서버 줄 ---------- */

	function renderMeta() {
		if (!state) return;
		var now = Date.now();
		state.servers.forEach(function (sv, i) {
			var card = $("servers").children[i];
			if (!card) return;
			var st = sv.status, parts = [];
			card.setAttribute("data-st", st);
			var text = STATUS_TEXT[st];
			if (st === "starting") text += sv.waiting ? " · 차례 기다림" : sv.startedAtMs ? " · " + fmtDur(now - sv.startedAtMs) : "";
			if (st === "running" && sv.startedAtMs) text += " · " + fmtDur(now - sv.startedAtMs);
			card.querySelector('[data-k="state"]').textContent = text;

			if (st === "stopped") parts.push(esc(baseName(sv.project)));
			var m = memSnap && memSnap.servers[i];
			if (m && m.privateMb && st !== "stopped") {
				parts.push('<span title="작업 집합 ' + m.wsMb + "MB · 전용 " + m.privateMb + 'MB">메모리 <b class="num">' + fmtMb(m.privateMb) + "</b></span>");
			}
			if (sv.startupMs != null && st !== "stopped") {
				// 단계별 시간은 마우스를 올리면 보인다 (상태 탭 · logs/startup-history.csv 에도 남는다)
				var tip = (sv.phases || []).map(function (p) { return p.label + " " + (p.ms / 1000).toFixed(1) + "초"; }).join("\n");
				parts.push('<span title="' + esc(tip) + '">기동 <b class="num">' + (sv.startupMs / 1000).toFixed(1) + "초</b></span>");
			}
			if (sv.pid) parts.push('<span class="num">PID ' + sv.pid + "</span>");
			if (sv.compiling) parts.push("<b>컴파일 중</b>");
			if (sv.depsBusy) parts.push("<b>의존 jar 받는 중</b>");
			card.querySelector('[data-k="meta"]').innerHTML = parts.join('<span class="sep">·</span>');
		});
	}

	function render(s) {
		var prev = state;
		state = s;
		if (!built) build(s);
		else if (shapeSig(s) !== builtSig) rebuild(s);

		$("optHot").checked = s.hotReload;
		$("optAuto").checked = s.autoCompile;
		$("optDebug").checked = s.debug;
		$("optFast").checked = s.fastJvm;
		$("optStagger").checked = s.staggerStart;
		$("optSkipScan").checked = s.skipScan;
		$("optProfile").checked = s.profileStart;
		$("optPool").checked = s.smallPool;
		$("optSchedule").checked = s.noSchedule;
		$("optLazy").checked = s.lazyInit;
		$("optMapper").checked = s.mapperHotswap;
		$("optSession").checked = s.keepSession;
		$("optUpdate").checked = s.updateCheck;
		var u = s.update;
		$("updNow").disabled = u.checking || u.downloading != null;
		$("updGo").hidden = !(u.release && u.installable);
		$("updGo").disabled = u.downloading != null;
		renderChangelog(s);
		$("updState").textContent = "지금 " + s.version + " · " + (u.checking ? "확인 중..."
			: u.release ? "새 판 " + u.release.version + " 이 있습니다" + (u.installable ? "" : " (소스에서 띄운 실행기라 직접 받아 설치합니다)")
			: u.error ? u.error
			: u.checkedAtMs ? "최신입니다 (" + new Date(u.checkedAtMs).toLocaleTimeString() + " 확인)" : "아직 확인하지 않았습니다");
		$("selHeap").value = String(s.heapMb);
		$("selCompiler").value = s.compiler;
		$("debugHint").textContent = s.servers.map(function (sv) { return sv.debugPort; }).join(" · ");
		$("debugHint").title = s.servers.map(function (sv) { return sv.name + " " + sv.debugPort; }).join(" · ");
		// 딸린 줄은 부모가 꺼지면 흐리게 — 「핫리로드일 때만」을 글 대신 자리와 흐림으로 보인다
		$("rowMapper").classList.toggle("off", !s.hotReload);
		$("selCompiler").closest(".opt").classList.toggle("off", !s.autoCompile);

		var changed = false;
		s.servers.forEach(function (sv, i) {
			var st = sv.status, card = $("servers").children[i];
			var was = prev && prev.servers[i] ? prev.servers[i].status : "stopped";
			// 기동 때만 읽는 옵션들 — 실행 중에 바꾸면 「다음 시작부터」 안내
			var now = [s.hotReload, s.debug, s.fastJvm, s.heapMb, s.skipScan, s.smallPool, s.noSchedule, s.lazyInit, s.mapperHotswap, s.keepSession, s.profileStart, s.paths.tldScan].join();
			if (st === "starting" && was === "stopped") bootCfg[i] = now;
			if (st === "stopped") delete bootCfg[i];
			if (bootCfg[i] && bootCfg[i] !== now) changed = true;

			// 꺼져 있으면 시작만, 켜져 있으면 재시작 · 중지만 보인다
			var pend = sv.restartNeeded || [];
			var q = function (k) { return card.querySelector('[data-k="' + k + '"]'); };
			q("start").hidden = st !== "stopped";
			q("start").disabled = sv.depsBusy;
			q("restart").hidden = st === "stopped";
			q("restart").disabled = st === "stopping";
			q("restart").classList.toggle("warn", pend.length > 0 && st === "running");
			q("rl").textContent = pend.length > 0 && st === "running" ? "재시작 (" + pend.length + ")" : "재시작";
			q("stop").hidden = st === "stopped";
			q("stop").disabled = st === "stopping";

			var bc = $("bctl" + i);
			bc.querySelector('[data-k="c"]').disabled = sv.compiling;
			bc.querySelector('[data-k="ca"]').disabled = sv.compiling;
			var lc = sv.lastCompile, cl = bc.querySelector('[data-k="cl"]');
			if (sv.compiling) { cl.className = "bres"; cl.textContent = "컴파일 중..."; }
			else if (lc) {
				cl.className = "bres " + (lc.ok ? "ok" : "fail");
				cl.innerHTML = "마지막 " + (lc.ok ? "<b>성공</b>" : "<b>실패 · 오류 " + lc.errors + "개</b>") +
					" · " + (lc.full ? "전체 " : "") + lc.files + "개 파일 · " + (lc.ms / 1000).toFixed(1) + "초 · " + fmtTime(lc.atMs);
			}
			var depsCheck = depsOf(sv);
			var db = bc.querySelector('[data-k="deps"]');
			db.disabled = st !== "stopped" || sv.depsBusy;
			db.classList.toggle("warn", !!depsCheck && !depsCheck.ok && !sv.depsBusy);
			db.textContent = sv.depsBusy ? "받는 중..." : "의존 jar 다시 받기";

			$("checks" + i).querySelector('[data-k="list"]').innerHTML = checkHtml(sv.checks, sv);
		});
		$("optNote").hidden = !changed;
		$("checks").innerHTML = checkHtml(s.checks);
		svnOnState(s);
		srvFill(s);
		vcsFill(s);
		renderMeta();
		renderAlerts();
		renderPhases();
		renderStatusbar();
		renderIgnore();
	}

	function depsOf(sv) { return sv.checks.filter(function (c) { return c.key === "deps"; })[0]; }

	// 같은 jar 다른 판 — dedup_deps 는 의존 jar 쪽 겹친 판을 deps.dup 로 치우고, undo_dedup 은 돌려놓는다
	function dedupCall(i, cmd) {
		hideError();
		invoke(cmd, { srv: i }).then(function (m) { showToast(m); }).catch(function (e) { showError(String(e)); });
	}

	// 「commons-io — 남김 … · 치움 …」 한 줄을 남김 · 치움 · 지울 것 색으로
	function planHtml(s) {
		var k = s.indexOf(" — ");
		return "<b>" + esc(s.slice(0, k)) + "</b> — " + s.slice(k + 3).split(" · ").map(function (p) {
			return '<span class="' + (/^남김/.test(p) ? "keep" : /^치움/.test(p) ? "drop" : "fix") + '">' + esc(p) + "</span>";
		}).join(" · ");
	}

	/* ---------- 저장 감시 제외 (파일 · 폴더 · 두 서버 공통) ---------- */

	function dirOf(path) {
		var k = path.lastIndexOf("/");
		return k > 0 ? path.slice(0, k + 1) : path;
	}
	function setIgnore(list, done) {
		invoke("set_ignore", { list: list }).then(function () { if (done) done(); }).catch(function (e) { showError(String(e)); });
	}
	// 여러 줄이면 줄마다 하나 — 빈 줄 · 겹치는 것은 실행기가 걸러 낸다 (clean_ignore)
	function addIgnore(text, toast) {
		var add = String(text || "").split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean);
		if (!add.length) return;
		setIgnore((state.ignore || []).concat(add), function () { if (toast) showToast(toast); });
	}
	// 재시작 목록의 「무시…」 메뉴 — 넓은 것은 아래로. 확장자는 범위가 넓어(*.xml 이면 매퍼 · Spring 설정까지) 맨 아래에 둔다
	function ignoreChoices(path) {
		var name = baseName(path), dot = name.lastIndexOf(".");
		var said = " 를 무시합니다. 「설정 › 저장 감시 제외」에서 뺄 수 있습니다.";
		var out = [
			{ label: "이 이름의 파일 · 어느 폴더에서나", sub: name },
			{ label: "이 폴더 아래 전부", sub: dirOf(path) }
		];
		if (dot > 0 && dot < name.length - 1) out.push({ label: "이 확장자 전부 · 어느 폴더에서나", sub: "*" + name.slice(dot) });
		out.forEach(function (it) { it.run = function () { addIgnore(it.sub, it.sub + said); }; });
		return out;
	}
	// 실행기가 늘 빼는 것 — app/src/main.rs 의 이름 규칙 · resources 아래 사본 규칙을 그대로 옮겨 적었다. 그쪽을 바꾸면 여기도 고친다
	var IGNORE_BUILTIN = ["편집기 임시 파일 (~ · .tmp · .swp · . 으로 시작)", "src/main/resources/resources-* · java/ · webapp/"];
	function renderIgnore() {
		var list = state.ignore || [];
		var ul = $("ignList");
		ul.innerHTML = IGNORE_BUILTIN.map(function (p) {
			return '<li class="builtin" title="실행기가 늘 뺍니다"><span class="tag">기본</span><span class="mono">' + esc(p) + "</span></li>";
		}).join("") + list.map(function (p, k) {
			return '<li><span class="mono">' + esc(p) + '</span><button class="btn ghost sm" data-k="' + k + '">빼기</button></li>';
		}).join("");
		[].forEach.call(ul.querySelectorAll("button"), function (b) {
			b.onclick = function () {
				var next = list.slice();
				next.splice(+b.getAttribute("data-k"), 1);
				setIgnore(next);
			};
		});
	}
	$("ignAdd").onclick = function () {
		var v = $("ignInput").value.trim();
		if (!v) { $("ignInput").focus(); return; }
		addIgnore(v, "무시 목록에 더했습니다.");
		$("ignInput").value = "";
	};
	$("ignInput").onkeydown = function (e) { if (e.key === "Enter") $("ignAdd").onclick(); };
	// 한 줄 칸은 붙여 넣은 줄바꿈을 지워 경로가 한 덩어리로 붙는다 — 여러 줄이면 칸을 거치지 않고 줄마다 넣는다
	$("ignInput").onpaste = function (e) {
		var text = (e.clipboardData || window.clipboardData).getData("text");
		var lines = text.split(/\r?\n/).filter(function (s) { return s.trim(); });
		if (lines.length < 2) return;
		e.preventDefault();
		addIgnore(lines.join("\n"), lines.length + "줄을 무시 목록에 더했습니다.");
	};
	// 예시를 누르면 입력칸에 넣는다 — 고쳐서 바로 추가하도록
	[].forEach.call(document.querySelectorAll("#setIgnore .pat .ex"), function (b) {
		b.onclick = function () {
			var inp = $("ignInput");
			inp.value = b.textContent;
			inp.focus();
			inp.select();
		};
	});

	/* ---------- 알림 줄 — 지금 손볼 일만. 정상이면 아무것도 없다 ---------- */

	function renderAlerts() {
		if (!state) return;
		var rows = [];
		if (errMsg) rows.push({ key: "err", lv: "crit", text: "<b>" + esc(errMsg) + "</b>", close: true });
		state.servers.forEach(function (sv, i) {
			var lc = sv.lastCompile;
			if (!sv.project) {
				rows.push({ key: "p" + i, lv: "warn", text: "<b>" + esc(sv.name) + " · 프로젝트 폴더를 정하지 않았습니다</b>" +
					'<span class="sub">이클립스 설정을 가져오거나 폴더 하나만 고르면 됩니다</span>',
					acts: [["시작하기", "primary", false, function () { openSetup(); }]] });
				return;
			}
			if (lc && !lc.ok && !sv.compiling) {
				// 첫 오류의 파일:줄 — 누르면 편집기로 연다
				var first = (lastErrs[i] || [])[0], fm = first && SRC_RE.exec(first);
				rows.push({ key: "c" + i, lv: "crit", text: "<b>" + esc(sv.name) + " · 컴파일 실패 · 오류 " + lc.errors + "개</b>" +
					(fm ? '<a class="src" title="' + esc(fm[1]) + ' · 편집기로 열기">' + esc(baseName(fm[1]) + ":" + fm[2]) + "</a>" +
						'<span class="sub">' + esc(first.slice(fm.index + fm[0].length).trim()) + "</span>"
						: state.autoCompile ? '<span class="sub">고치고 저장하면 다시 컴파일합니다</span>' : ""),
					src: fm ? { file: fm[1], line: parseInt(fm[2], 10) } : null,
					acts: [["빌드 로그 보기", "", false, function () { go("build"); }]] });
			}
			var pend = sv.restartNeeded || [];
			if (pend.length && sv.status !== "stopped") {
				rows.push({ key: "r" + i, srv: i, lv: "warn", text: "<b>" + esc(sv.name) + " · 재시작해야 반영되는 변경 " + pend.length + "건</b>" +
					'<span class="sub mono">' + esc(pend.slice(0, 3).map(function (x) { return baseName(x.path); }).join(", ")) + (pend.length > 3 ? " 외" : "") + "</span>",
					items: pend,
					acts: [[sv.name + " 재시작", "warn", sv.status !== "running", function () { hideError(); call("restart", { srv: i }); }]] });
			}
			var deps = depsOf(sv);
			if (deps && !deps.ok && !sv.depsBusy) {
				var stopped = sv.status === "stopped";
				rows.push({ key: "d" + i, lv: "warn", text: "<b>" + esc(sv.name) + " · 의존 jar " + esc(deps.detail) + "</b>" +
					(stopped ? "" : '<span class="sub">서버를 끈 뒤에 받을 수 있습니다</span>'),
					acts: [["자동으로 채우기", "primary", !stopped, function () {
						hideError();
						invoke("auto_deps", { srv: i }).then(function (m) { showToast(m); }).catch(function (e) { showError(String(e)); });
					}]] });
			}
			// 같은 jar 다른 판 — 시작은 되지만 켜기 전에 눈에 띄게 (설명 첫 줄이 요약이다).
			// 의존 jar 쪽은 단추로 치우고, 프로젝트 WEB-INF/lib 안의 겹침은 지울 파일을 「자세히」에 적는다
			var dup = sv.checks.filter(function (c) { return c.key === "depsDup"; })[0], dd = sv.dedup;
			if (dup) {
				var dl = dup.detail.split("\n"), idle = sv.status === "stopped" && !sv.depsBusy;
				var how = [];
				if (dd.movable) how.push("의존 jar 쪽 " + dd.movable + "개를 치우면 한 판만 올라갑니다" + (idle ? "" : " (서버를 끈 뒤에)"));
				if (dd.manual) how.push(dd.manual + "종은 프로젝트 WEB-INF/lib 에서 지워야 합니다");
				rows.push({ key: "dd" + i, lv: "warn", text: "<b>" + esc(sv.name) + " · 같은 jar 다른 판 " + esc(dl[0].split(" · ")[0]) + "</b>" +
					'<span class="sub">' + esc(dl[0].split(" · ").slice(1).join(" · ")) + " — " + esc(how.join(" · ")) + "</span>",
					lines: dd.lines,
					acts: (dd.movable ? [["겹친 판 치우기 (" + dd.movable + ")", "primary", !idle, function () { dedupCall(i, "dedup_deps"); }]] : [])
						.concat([["상태 보기", "", false, function () { go("status"); }]]) });
			}
			// 이클립스와 다른 자바로 뜬다 — 「 — 」 앞이 요약, 뒤가 할 일. 핫리로드 모드면 끄는 단추를 붙인다 (끄면 이클립스와 같은 자바로 뜬다)
			if (sv.javaDiff && javaDismissed[sv.id] !== sv.javaDiff) {
				var jd = sv.javaDiff.split(" — ");
				rows.push({ key: "j" + i, lv: "warn", close: function () { javaDismissed[sv.id] = sv.javaDiff; renderAlerts(); },
					text: "<b>" + esc(sv.name) + " · " + esc(jd[0]) + "</b>" + '<span class="sub">' + esc(jd.slice(1).join(" — ")) + "</span>",
					acts: state.hotReload
						? [["핫리로드 끄기", "", false, function () { hideError(); call("set_option", { key: "hotReload", value: false }); showToast("핫리로드를 껐습니다 · 다음 기동부터 이클립스와 같은 자바로 뜹니다"); }]]
						: [["설정 › 서버", "", false, function () { openSettings("setServers"); }]] });
			}
		});
		var up = state.update, rel = up.release;
		if (rel && updDismissed !== rel.version) {
			var mb = function (b) { return (b / 1048576).toFixed(0) + "MB"; };
			var on = state.servers.filter(function (s) { return s.status !== "stopped"; }).length;
			rows.push({ key: "upd", lv: "ok", close: function () { updDismissed = rel.version; renderAlerts(); },
				text: "<b>새 판 " + esc(rel.version) + " 이 있습니다</b>" +
					'<span class="sub">' + (up.downloading != null ? "받는 중 " + mb(up.downloading) + " / " + mb(rel.size)
						: up.error ? esc(up.error) : "지금 " + esc(state.version) +
							(up.installable ? (on ? " · 켜진 톰캣 " + on + "개를 끄고 설치한 뒤 다시 엽니다" : " · 설치한 뒤 다시 엽니다") : "")) + "</span>",
				acts: [["변경 내용", "", false, function () { openChangelog(); }]].concat(up.installable
					? [["업데이트", "primary", up.downloading != null, function () { updateAsk(); }]]
					: [["받으러 가기", "primary", false, function () { invoke("open", { target: rel.page }); }]]) });
		}
		var bad = state.checks.filter(function (c) { return !c.ok; });
		if (bad.length) {
			rows.push({ key: "chk", lv: "crit", text: "<b>준비 안 된 항목 " + bad.length + "개</b>" +
				'<span class="sub">' + esc(bad.map(function (c) { return c.label; }).join(", ")) + "</span>",
				acts: [["상태 보기", "", false, function () { go("status"); }]] });
		}

		// 오류를 경고보다 위에 (같은 등급은 서버 순서대로)
		var LV = { crit: 0, warn: 1, ok: 2 };
		rows = rows.map(function (r, k) { return [r, k]; }).sort(function (a, b) { return LV[a[0].lv] - LV[b[0].lv] || a[1] - b[1]; }).map(function (x) { return x[0]; });

		var box = $("alerts");
		box.innerHTML = "";
		rows.forEach(function (r) {
			var el = document.createElement("div");
			el.className = "alert " + r.lv;
			el.setAttribute("role", r.lv === "crit" ? "alert" : "status");
			var open = !!alertOpen[r.key];
			el.innerHTML = ic(r.lv === "crit" ? "error" : r.lv === "ok" ? "check" : "warn") + '<div class="alert-text">' + r.text + "</div>" + '<div class="alert-acts"></div>' +
				(r.items && open ? '<ul class="alert-items">' + r.items.map(function (x, k) {
					return '<li data-srv="' + r.srv + '" data-path="' + esc(x.path) + '"><span class="mono">' + esc(x.path) + "</span><small>" + esc(x.why) + "</small>" +
						'<button class="btn ghost sm" data-ign="' + k + '" aria-haspopup="menu" title="저장 감시에서 뺄 범위를 고릅니다">무시…</button></li>';
				}).join("") + "</ul>" : "") +
				(r.lines && open ? '<ul class="alert-items">' + r.lines.map(function (s) { return "<li><span>" + planHtml(s) + "</span></li>"; }).join("") + "</ul>" : "");
			// 재시작이 필요 없는 파일(반영용 SQL 등)이 쌓이면 폴더 · 파일 이름 · 확장자 가운데 골라 무시 목록에 넣는다
			[].forEach.call(el.querySelectorAll("[data-ign]"), function (b) {
				var path = r.items[+b.getAttribute("data-ign")].path;
				b.onclick = function (ev) { ev.stopPropagation(); openMenu(b, ignoreChoices(path)); };
			});
			var acts = el.querySelector(".alert-acts");
			var src = el.querySelector("a.src");
			if (src && r.src) {
				src.onclick = function () { invoke("open_source", r.src); };
				src.setAttribute("data-file", r.src.file);
				src.setAttribute("data-line", r.src.line);
			}
			if (r.items || r.lines) {
				var t = document.createElement("button");
				t.className = "btn ghost sm";
				t.textContent = r.lines ? (open ? "접기" : "자세히") : open ? "목록 접기" : "목록 보기";
				t.onclick = function () { alertOpen[r.key] = !open; renderAlerts(); };
				acts.appendChild(t);
			}
			(r.acts || []).forEach(function (a) {
				var b = document.createElement("button");
				b.className = "btn sm " + a[1];
				b.textContent = a[0];
				b.disabled = a[2];
				b.onclick = a[3];
				acts.appendChild(b);
			});
			if (r.close) {
				var c = document.createElement("button");
				c.className = "btn ghost sm";
				c.title = "닫기";
				c.innerHTML = ic("x");
				c.onclick = typeof r.close === "function" ? r.close : hideError;
				acts.appendChild(c);
			}
			box.appendChild(el);
		});

		// 창 제목 — 작업 표시줄에 마우스를 올리면 보인다
		var first = rows.filter(function (r) { return r.key !== "err" && r.key !== "upd"; })[0];
		var title = first ? APP_TITLE + " · " + first.text.replace(/<span class="sub">.*$/, "").replace(/<[^>]+>/g, "")
			.replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"') + (rows.length > 1 ? " 외 " + (rows.length - 1) + "건" : "") : APP_TITLE;
		if (title !== lastTitle) {
			lastTitle = title;
			document.title = title;
			if (appWin) appWin.setTitle(title).catch(function () { /* 권한이 없으면 화면 제목만 바꾼다 */ });
		}
	}

	/* ---------- 상태 탭 ---------- */

	// 메모리 — 톰캣은 힙 상한에 대한 막대를 함께 그린다 (상한에 가까우면 노란색)
	function renderMems() {
		if (!state || !memSnap) return;
		var rows = [];
		state.servers.forEach(function (sv, i) {
			var m = memSnap.servers[i] || { wsMb: 0, privateMb: 0 };

			var cap = state.heapMb ? state.heapMb + 400 : 0;  // 힙 상한 + 클래스 영역 · 코드 캐시 · 스레드 몫(대략)
			// 2026-10-28 : 보조 줄은 숫자만 두고, 막대 기준 · 내리는 시점 같은 설명은 title 로 옮겼다
			var bar = cap ? '<span class="bar" title="힙 상한 ' + fmtMb(state.heapMb) + ' + 400MB 기준"><i class="' + (m.privateMb > cap * 0.9 ? "hi" : "") + '" style="width:' +
				Math.min(100, Math.round(m.privateMb / cap * 100)) + '%"></i></span>' : "";
			rows.push('<div class="mem"><span>' + esc(sv.name) + ' 톰캣</span><b class="num">' + fmtMb(m.privateMb) + "</b>" + bar +
				'<small class="num">작업 집합 ' + fmtMb(m.wsMb) + (state.heapMb ? " · 힙 상한 " + fmtMb(state.heapMb) : " · 힙 상한 없음") + "</small></div>");
		});
